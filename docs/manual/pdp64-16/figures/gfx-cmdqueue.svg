<text x="20.0" y="250.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The program mostly writes commands (put this text, move this sprite); the window is for the cases where a poke is simpler.</text>
<text x="20.0" y="266.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The window and the engine both reach video memory, so the device must say which one wins when they touch the same cell.</text>
<text x="20.0" y="290.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Nothing here is decided (3.19).</text>
