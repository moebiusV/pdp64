<text x="265.0" y="174.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">peek/poke window</text>
<text x="265.0" y="186.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">cells and pixels as plain memory</text>
