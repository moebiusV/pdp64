<text x="265.0" y="65.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">command ring</text>
<text x="265.0" y="77.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">in memory: avail / used rings</text>
