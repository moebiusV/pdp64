<svg xmlns="http://www.w3.org/2000/svg" width="690" height="340" viewBox="0 0 690 340" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the first pages of physical memory after reset</text>
<rect x="120.0" y="28.0" width="250.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="47.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">RAM and device windows</text>
<text x="245.0" y="59.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a window may go anywhere except the first few pages</text>
<rect x="120.0" y="68.0" width="250.0" height="28.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="85.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">the second stage and kernel are loaded above</text>
<rect x="120.0" y="96.0" width="250.0" height="44.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="117.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">stack, first 64 KB</text>
<text x="245.0" y="129.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r14 starts at the top of the first 64 KB</text>
<rect x="120.0" y="140.0" width="250.0" height="34.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="156.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">boot-information block</text>
<text x="245.0" y="168.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r1 points at it; size and place not specified</text>
<rect x="120.0" y="174.0" width="250.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="190.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">block 0: the first 512 bytes of the disk</text>
<text x="245.0" y="202.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">0x1000 (an address still to be chosen)</text>
<rect x="120.0" y="208.0" width="250.0" height="70.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="242.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">vector table: page 0</text>
<text x="245.0" y="254.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">512 entries x 8 bytes = 4096 bytes, VBR = 0 at reset</text>
<text x="112.0" y="284.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x0000</text>
<text x="112.0" y="215.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x1000</text>
<text x="112.0" y="104.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x10000</text>
<path d="M378.0,278.0 L378.0,140.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="388.0" y="206.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the first few pages:</text>
<text x="388.0" y="220.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">boot code and boot data; no device</text>
<text x="388.0" y="233.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">window is placed here (how many</text>
<text x="388.0" y="246.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">pages is not decided)</text>
<text x="20.0" y="300.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">(not to scale; the place and size of the boot-information block are not specified)</text>
<text x="20.0" y="314.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">After reset: kernel mode, priority 7, translation off (every address physical), VBR 0, guard clear.</text>
<text x="20.0" y="328.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The PDP-11 kept its vectors at 0 to 0376 octal and booted from elsewhere; here the table is one whole page at 0.</text>
</svg>
