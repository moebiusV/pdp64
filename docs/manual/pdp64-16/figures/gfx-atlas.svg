<text x="20.0" y="222.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">To draw the screen: send the GPU a list with one entry per cell, and run one draw call.</text>
<text x="20.0" y="240.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">entry = (cell column, cell row, atlas rectangle of the glyph, foreground, background)</text>
<text x="20.0" y="256.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">vertex shader: turn the cell position into screen corners; pixel shader: look the glyph up, mix fg and bg</text>
<text x="20.0" y="272.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">a change of one cell, or a scroll by a row, is a change to the list or to a number, not to 2 million pixels</text>
<text x="20.0" y="300.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The atlas is made by a font rasteriser (CPU) and uploaded once; new glyphs are added as they first appear.</text>
