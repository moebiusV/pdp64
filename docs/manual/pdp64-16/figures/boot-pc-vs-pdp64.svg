<svg xmlns="http://www.w3.org/2000/svg" width="690" height="428" viewBox="0 0 690 428" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">three ways to start a machine: the PC with a BIOS, the PC with UEFI, the pdp64</text>
<text x="20.0" y="38.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">PC with a BIOS (since 1981)</text>
<rect x="20.0" y="44.0" width="110.8" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="75.4" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">firmware in flash</text>
<text x="75.4" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">self-test, setup</text>
<path d="M130.8,72.0 L154.8,72.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="154.8,72.0 146.8,75.6 146.8,68.4" fill="#222"/>
<rect x="154.8" y="44.0" width="110.8" height="56.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="210.2" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">BIOS services</text>
<text x="210.2" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">INT 13h, INT 10h</text>
<path d="M265.6,72.0 L289.6,72.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="289.6,72.0 281.6,75.6 281.6,68.4" fill="#222"/>
<rect x="289.6" y="44.0" width="110.8" height="56.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot sector</text>
<text x="345.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">MBR: 446 bytes</text>
<path d="M400.4,72.0 L424.4,72.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="424.4,72.0 416.4,75.6 416.4,68.4" fill="#222"/>
<rect x="424.4" y="44.0" width="110.8" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="479.8" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot loader</text>
<text x="479.8" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">GRUB, NTLDR</text>
<path d="M535.2,72.0 L559.2,72.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="559.2,72.0 551.2,75.6 551.2,68.4" fill="#222"/>
<rect x="559.2" y="44.0" width="110.8" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="614.6" y="75.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel</text>
<text x="20.0" y="118.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">the loader calls the BIOS for every disk read, in 16-bit real mode, and has no drivers of its own</text>
<text x="20.0" y="144.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">PC with UEFI (since about 2005)</text>
<rect x="20.0" y="150.0" width="110.8" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="75.4" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">firmware in flash</text>
<text x="75.4" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a firmware stack</text>
<path d="M130.8,178.0 L154.8,178.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="154.8,178.0 146.8,181.6 146.8,174.4" fill="#222"/>
<rect x="154.8" y="150.0" width="110.8" height="56.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="210.2" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot services</text>
<text x="210.2" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">files, memory, ...</text>
<path d="M265.6,178.0 L289.6,178.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="289.6,178.0 281.6,181.6 281.6,174.4" fill="#222"/>
<rect x="289.6" y="150.0" width="110.8" height="56.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">GPT and FAT</text>
<text x="345.0" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">firmware reads files</text>
<path d="M400.4,178.0 L424.4,178.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="424.4,178.0 416.4,181.6 416.4,174.4" fill="#222"/>
<rect x="424.4" y="150.0" width="110.8" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="479.8" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">loader.efi</text>
<text x="479.8" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a PE/COFF program</text>
<path d="M535.2,178.0 L559.2,178.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="559.2,178.0 551.2,181.6 551.2,174.4" fill="#222"/>
<rect x="559.2" y="150.0" width="110.8" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="614.6" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel</text>
<text x="614.6" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">ExitBootServices</text>
<text x="20.0" y="224.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">no boot sector: the firmware parses the GPT and the FAT file system, runs the loader file, which calls the services and then gives them up</text>
<text x="20.0" y="250.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the pdp64</text>
<rect x="20.0" y="256.0" width="144.5" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="92.2" y="283.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot ROM</text>
<text x="92.2" y="295.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">in the controller chip</text>
<path d="M164.5,284.0 L188.5,284.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="188.5,284.0 180.5,287.6 180.5,280.4" fill="#222"/>
<rect x="188.5" y="256.0" width="144.5" height="56.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="260.8" y="283.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">block 0</text>
<text x="260.8" y="295.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the first stage</text>
<path d="M333.0,284.0 L357.0,284.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="357.0,284.0 349.0,287.6 349.0,280.4" fill="#222"/>
<rect x="357.0" y="256.0" width="144.5" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="429.2" y="283.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">second stage</text>
<text x="429.2" y="295.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">its own drivers; virtio</text>
<path d="M501.5,284.0 L525.5,284.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="525.5,284.0 517.5,287.6 517.5,280.4" fill="#222"/>
<rect x="525.5" y="256.0" width="144.5" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="597.8" y="283.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel</text>
<text x="597.8" y="295.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">/bsd</text>
<text x="20.0" y="330.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">no services layer to call and nothing to give up: every stage after the ROM is an ordinary program built by the project's compiler</text>
<text x="20.0" y="358.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The PDP-11 chain was the pdp64's: ROM or front panel, block 0, boot, unix (4.1).</text>
<text x="20.0" y="371.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Both PC chains are general knowledge, unverified (4.12), except where the OpenBSD loaders show it: the amd64 tree</text>
<text x="20.0" y="384.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">on this machine has both, biosboot (862 lines) with boot (189), and efiboot (4,593 lines), measured (4.12).</text>
<text x="20.0" y="399.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Years are general knowledge, unverified.  Real UEFI firmware has more phases than drawn,</text>
<text x="20.0" y="412.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">and keeps some code resident that the operating system cannot see.</text>
</svg>
