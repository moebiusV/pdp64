<text x="119.0" y="155.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">app, app, SID</text>
<rect x="196.0" y="124.0" width="105.0" height="40.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="248.5" y="143.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">convert</text>
<text x="248.5" y="155.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">rate, format, volume</text>
