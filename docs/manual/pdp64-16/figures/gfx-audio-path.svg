<text x="370.5" y="155.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">sum, clip or limit</text>
<rect x="440.0" y="124.0" width="120.0" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="500.0" y="143.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">ring buffer</text>
<text x="500.0" y="155.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">read at 48 kHz: underrun</text>
<rect x="582.0" y="124.0" width="100.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="632.0" y="147.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">DAC / HDMI audio</text>
