<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the console, timer and entropy source: the options (OPEN, 5.7.1; nothing decided)</text>
<rect x="20.0" y="32.0" width="210.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="125.0" y="50.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">console</text>
<rect x="20.0" y="70.0" width="210.0" height="52.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="125.0" y="95.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">fixed registers (KL11 shape)</text>
<text x="125.0" y="107.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">exists: QEMU, tests/qemu</text>
<rect x="20.0" y="132.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="125.0" y="157.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">virtio-console, queues 0 and 1</text>
<text x="125.0" y="169.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">plus emerg_wr: one-character write</text>
<rect x="20.0" y="194.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="125.0" y="219.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">16550-style UART</text>
<text x="125.0" y="231.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">lean of F11 (decisions-pending)</text>
<rect x="250.0" y="32.0" width="210.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="355.0" y="50.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">timer</text>
<rect x="250.0" y="70.0" width="210.0" height="52.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="355.0" y="95.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">fixed counter + compare</text>
<text x="355.0" y="107.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">exists: level 6, vector 32</text>
<rect x="250.0" y="132.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="355.0" y="157.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">counter and compare in the core</text>
<text x="355.0" y="169.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">system registers; lean of smp-decisions 4</text>
<rect x="250.0" y="194.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="355.0" y="219.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">virtio clock / rtc</text>
<text x="355.0" y="231.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">read and alarm requests; no tick</text>
<rect x="480.0" y="32.0" width="210.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="50.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">entropy</text>
<rect x="480.0" y="70.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="585.0" y="95.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">virtio-rng, one queue</text>
<text x="585.0" y="107.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the device fills a buffer</text>
<rect x="480.0" y="132.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="585.0" y="157.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">absorb-and-squeeze pool</text>
<text x="585.0" y="169.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">errata 85; a fixed device</text>
<rect x="480.0" y="194.0" width="210.0" height="52.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="585.0" y="219.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">software and a boot seed only</text>
<text x="585.0" y="231.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">no entropy hardware</text>
<rect x="20.0" y="262.0" width="650.0" height="30.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="28.0" y="276.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">The green boxes exist in the repository (a fixed device each, behind the withdrawn space bit of errata 60); dashed boxes are candidates only.</text>
<text x="28.0" y="288.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">Whether these three follow "virtio across the board" (errata 95) is part of what is open.</text>
<text x="20.0" y="314.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">A virtio-console needs the bus and a queue before it can print; its emergency write needs the bus and no queue.  A fixed console needs neither.</text>
<text x="20.0" y="328.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sources: spec/pdp64-system.hbnf, qemu/hw-pdp64, virtio_console.h, virtio_rtc.h, QEMU virtio-rng.c (read); the briefing B.md, Q6 (open material).</text>
</svg>
