<svg xmlns="http://www.w3.org/2000/svg" width="690" height="350" viewBox="0 0 690 350" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="18.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">a base-address register (BAR) and the window it places in the physical address space</text>
<text x="20.0" y="42.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">bit 31</text>
<text x="420.0" y="42.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans, sans-serif">0</text>
<rect x="20.0" y="48.0" width="292.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="166.0" y="68.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">base address bits 31..4</text>
<rect x="312.0" y="48.0" width="36.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="330.0" y="68.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">P</text>
<rect x="348.0" y="48.0" width="36.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="366.0" y="68.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">type</text>
<rect x="384.0" y="48.0" width="36.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="402.0" y="68.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">S</text>
<text x="20.0" y="98.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">S: 0 = memory, 1 = I/O port    type: 00 = 32-bit, 10 = 64-bit    P: prefetchable</text>
<rect x="20.0" y="112.0" width="400.0" height="62.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="28.0" y="128.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">size it: write all ones, read it back, clear the low four bits</text>
<text x="28.0" y="144.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">write 0xFFFFFFFF  -&gt;  read 0xFFFFC000</text>
<text x="28.0" y="160.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">size = (not 0xFFFFC000) + 1 = 0x4000 = 16 KB</text>
<text x="585.0" y="42.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">physical address space</text>
<text x="585.0" y="62.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">top: 2^N, N = 40 to 64</text>
<rect x="500.0" y="70.0" width="170.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="93.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">free</text>
<rect x="500.0" y="110.0" width="170.0" height="40.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="129.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">window of device B</text>
<text x="585.0" y="141.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a whole number of pages</text>
<rect x="500.0" y="150.0" width="170.0" height="30.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="168.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">free</text>
<rect x="500.0" y="180.0" width="170.0" height="40.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="199.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">window of device A</text>
<text x="585.0" y="211.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a whole number of pages</text>
<rect x="500.0" y="220.0" width="170.0" height="70.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="258.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">free / RAM</text>
<rect x="500.0" y="290.0" width="170.0" height="30.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="308.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">boot code and data</text>
<text x="494.0" y="320.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0</text>
<path d="M420.0,66.0 L470.0,66.0 L470.0,200.0 L500.0,200.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="500.0,200.0 492.0,203.6 492.0,196.4" fill="#222"/>
<text x="24.0" y="192.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The firmware or kernel writes the base it chooses; the device then</text>
<text x="24.0" y="206.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">answers base .. base+size-1 and no others. A window may sit anywhere</text>
<text x="24.0" y="220.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">except the first few pages (errata 97, 102). The drawing is an example;</text>
<text x="24.0" y="234.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">where the windows really sit is not decided.</text>
<text x="24.0" y="262.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">a 64-bit BAR: two consecutive BARs, the low half first</text>
<rect x="20.0" y="270.0" width="200.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="120.0" y="287.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">BAR2: low 32 bits (type = 10)</text>
<rect x="220.0" y="270.0" width="200.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="320.0" y="287.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">BAR3: high 32 bits</text>
<text x="24.0" y="316.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sizing rule as in the header comment of pci_regs.h.</text>
</svg>
