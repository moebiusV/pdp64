<svg xmlns="http://www.w3.org/2000/svg" width="690" height="430" viewBox="0 0 690 430" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">one disk, three zooms: the whole disk, block 0, and the pdp64 partition</text>
<text x="20.0" y="32.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the disk</text>
<text x="84.0" y="32.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">each cell is a run of 512-byte sectors, not to scale; sector counts are 64-bit (4.5.4)</text>
<rect x="20.0" y="48.0" width="66.0" height="56.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="53.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">protective</text>
<text x="53.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">MBR</text>
<text x="22.0" y="44.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">LBA 0</text>
<rect x="86.0" y="48.0" width="50.0" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="111.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">GPT</text>
<text x="111.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">header</text>
<text x="88.0" y="44.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">LBA 1</text>
<rect x="136.0" y="48.0" width="82.0" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="177.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">GPT partition</text>
<text x="177.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">entries</text>
<text x="138.0" y="44.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">LBA 2..</text>
<rect x="218.0" y="48.0" width="108.0" height="56.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="272.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot partition</text>
<text x="272.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">(optional, 4.5.2)</text>
<rect x="326.0" y="48.0" width="168.0" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="410.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">OpenBSD-type partition</text>
<text x="410.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">holds the label</text>
<rect x="494.0" y="48.0" width="104.0" height="56.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="546.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">other partitions</text>
<text x="546.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">(any system)</text>
<rect x="598.0" y="48.0" width="62.0" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="629.0" y="75.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">backup</text>
<text x="629.0" y="87.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">GPT</text>
<text x="600.0" y="44.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">end</text>
<text x="20.0" y="148.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">block 0, the protective MBR: 512 bytes</text>
<path d="M30.0,104.0 L30.0,156.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<path d="M76.0,104.0 L670.0,156.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<rect x="20.0" y="158.0" width="566.2" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="303.1" y="177.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot code: 446 bytes</text>
<text x="303.1" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the first stage: a short block list and a program that reads it</text>
<rect x="586.2" y="158.0" width="81.2" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="626.8" y="177.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">table</text>
<text x="626.8" y="189.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">64 bytes</text>
<rect x="667.5" y="158.0" width="2.5" height="40.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="670.0" y="212.0" font-size="8" text-anchor="end" fill="#333" font-family="DejaVu Sans, sans-serif">table: four entries; a GPT disk has one, of type 0xEE ("the whole disk is in use")</text>
<text x="670.0" y="224.0" font-size="8" text-anchor="end" fill="#222" font-family="DejaVu Sans, sans-serif">last two bytes: 0x55AA, the signature</text>
<text x="20.0" y="212.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">byte 0</text>
<text x="586.2" y="190.0" font-size="8" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif"></text>
<text x="20.0" y="224.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">byte 446 starts the table</text>
<text x="20.0" y="250.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">inside the OpenBSD-type partition (the yellow cell above; 4.5.3)</text>
<rect x="20.0" y="262.0" width="96.0" height="46.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="68.0" y="284.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">sector 0</text>
<text x="68.0" y="296.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">boot block</text>
<rect x="116.0" y="262.0" width="96.0" height="46.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="164.0" y="284.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">sector 1</text>
<text x="164.0" y="296.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">disk label</text>
<rect x="212.0" y="262.0" width="190.0" height="46.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="307.0" y="284.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">sectors 2 to 15</text>
<text x="307.0" y="296.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">rest of the 8 KB boot area</text>
<rect x="402.0" y="262.0" width="268.0" height="46.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="536.0" y="284.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">sector 16 on</text>
<text x="536.0" y="296.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the file system; its superblock at byte 8192</text>
<text x="20.0" y="326.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">The label (offset 0 of sector 1) has the magic number 0x82564557 and names up to 16 partitions (root, swap, ...);</text>
<text x="20.0" y="339.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">its sizes carry high fields beyond 32 bits.  The kernel is a file in the root file system, which the second stage finds.</text>
<text x="20.0" y="360.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">On the PDP-11 there was no such table: V7 compiled eight (size, first cylinder) pairs into each disk driver (hp_sizes[8] in hp.c).</text>
<text x="20.0" y="374.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">In 2.11BSD block 0 held the 512-byte bootstrap and block 1 the disk label: the same two places as here.</text>
<text x="20.0" y="396.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The MBR and GPT layouts are as the OpenBSD header disklabel.h has them (4.11); the 8 KB area and sector 1 are decided (4.5.3).</text>
<text x="20.0" y="410.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Whether a separate boot partition is needed at all is open: the block list can point into the root file system (4.12).</text>
</svg>
