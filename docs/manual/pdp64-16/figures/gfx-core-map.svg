<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">c64 mode: the host loads a program into a small core on the die, and the core is the terminal</text>
<rect x="20.0" y="40.0" width="150.0" height="150.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="56.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">host memory</text>
<rect x="34.0" y="66.0" width="122.0" height="44.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="87.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">program image</text>
<text x="95.0" y="99.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">terminal code</text>
<rect x="34.0" y="122.0" width="122.0" height="52.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="147.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">doorbell / mailbox</text>
<text x="95.0" y="159.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">host and core talk</text>
<rect x="205.0" y="66.0" width="90.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="250.0" y="87.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">DMA engine</text>
<text x="250.0" y="99.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">copies the image</text>
<path d="M156.0,88.0 L205.0,88.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="205.0,88.0 197.0,91.6 197.0,84.4" fill="#222"/>
<text x="180.0" y="78.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">1</text>
<text x="440.0" y="36.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the small core's address space</text>
<rect x="345.0" y="44.0" width="190.0" height="36.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="61.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">loaded program</text>
<text x="440.0" y="73.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">from the host</text>
<rect x="345.0" y="80.0" width="190.0" height="36.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="97.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">screen memory</text>
<text x="440.0" y="109.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">cells</text>
<rect x="345.0" y="116.0" width="190.0" height="36.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="133.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">colour RAM</text>
<text x="440.0" y="145.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a colour a cell</text>
<rect x="345.0" y="152.0" width="190.0" height="36.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="169.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">glyph slots</text>
<text x="440.0" y="181.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">filled by the TrueType engine</text>
<rect x="345.0" y="188.0" width="190.0" height="36.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="205.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">VIC registers</text>
<text x="440.0" y="217.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">video</text>
<rect x="345.0" y="224.0" width="190.0" height="36.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="241.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">SID registers</text>
<text x="440.0" y="253.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">sound</text>
<rect x="345.0" y="260.0" width="190.0" height="36.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="440.0" y="277.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">mailbox window</text>
<text x="440.0" y="289.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">shared with the host</text>
<path d="M295.0,88.0 L345.0,62.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="345.0,62.0 339.6,68.9 336.2,62.5" fill="#222"/>
<text x="320.0" y="66.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">2</text>
<rect x="205.0" y="150.0" width="90.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="250.0" y="169.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">reset line</text>
<text x="250.0" y="181.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">held until loaded</text>
<path d="M295.0,170.0 L320.0,170.0 L320.0,62.0 L345.0,62.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="256.0" y="208.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">3: released</text>
<path d="M345.0,278.0 L180.0,278.0 L180.0,174.0 L156.0,174.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="156.0,174.0 164.0,170.4 164.0,177.6" fill="#222"/>
<rect x="560.0" y="60.0" width="100.0" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="610.0" y="79.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">video out</text>
<text x="610.0" y="91.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">to HDMI</text>
<rect x="560.0" y="150.0" width="100.0" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="610.0" y="169.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">audio out</text>
<text x="610.0" y="181.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">to HDMI audio</text>
<path d="M535.0,134.0 L560.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="560.0,80.0 559.9,88.8 553.4,85.7" fill="#222"/>
<path d="M535.0,242.0 L560.0,170.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="560.0,170.0 560.8,178.7 554.0,176.4" fill="#222"/>
<text x="20.0" y="318.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">1  the host places the image in its own memory; the device copies it into the core by DMA (over PCI Express).</text>
<text x="20.0" y="334.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">2  the program lands at the core's load address;  3  the core is let out of reset and runs it as the terminal.</text>
<text x="20.0" y="356.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Which core, what the mailbox is, and how the image is checked are open (3.16); sizes and order are an example.</text>
</svg>
