<text x="270.0" y="183.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">odd address: attribute. 4 bits a colour: 16 colours</text>
<text x="270.0" y="196.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">bit 7: blink, or a bright background (a mode bit chooses)</text>
<text x="20.0" y="244.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The glyph shapes are in the display adapter, not in this memory; the cell says which, and in what colours.</text>
<text x="20.0" y="260.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Layout as in general knowledge of the IBM PC adapters (unverified here, 3.19).</text>
