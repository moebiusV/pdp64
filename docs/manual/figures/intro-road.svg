<text x="95.0" y="183.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">Unibus</text>
<text x="95.0" y="195.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">devices are memory, CSR, DMA</text>
