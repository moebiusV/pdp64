<text x="441.0" y="195.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">devices describe themselves</text>
<path d="M516.0,184.0 L539.0,184.0" fill="none" stroke="#222" stroke-width="1.4"/>
