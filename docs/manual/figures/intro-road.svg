<text x="268.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">32 bits, virtual memory</text>
<path d="M343.0,72.0 L366.0,72.0" fill="none" stroke="#222" stroke-width="1.4"/>
