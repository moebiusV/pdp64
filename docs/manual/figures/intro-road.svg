<text x="95.0" y="71.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">PDP-11</text>
<text x="95.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">orthogonal modes, PC, SP</text>
