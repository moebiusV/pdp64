<text x="614.0" y="195.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">one transport for every device</text>
<text x="20.0" y="262.0" font-size="10.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the terminal</text>
