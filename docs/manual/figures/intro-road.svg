<text x="614.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">64 bits, 32 registers, restartable</text>
<text x="20.0" y="150.0" font-size="10.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the bus</text>
