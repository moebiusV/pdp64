<polygon points="366.0,296.0 358.0,299.6 358.0,292.4" fill="#222"/>
<rect x="366.0" y="268.0" width="150.0" height="56.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="441.0" y="295.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">Blit, C64</text>
<text x="441.0" y="307.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">text, sprites, sound by stores</text>
<path d="M516.0,296.0 L539.0,296.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="539.0,296.0 531.0,299.6 531.0,292.4" fill="#222"/>
<rect x="539.0" y="268.0" width="150.0" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="614.0" y="295.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">virtio-gpu + HDMI</text>
<text x="614.0" y="307.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the same, modern depth</text>
<text x="20.0" y="364.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Chapters: processor 9 and 6; bus 2 and 5; terminal 3.  Steps between are named in the chapters; the author's dated record is appendix G.</text>
