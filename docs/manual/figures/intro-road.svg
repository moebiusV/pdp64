<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="345.0" y="16.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the road from the PDP-11: each step and what it gave</text>
<text x="20.0" y="38.0" font-size="10.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the processor</text>
