<svg xmlns="http://www.w3.org/2000/svg" width="690" height="300" viewBox="0 0 690 300" font-family="DejaVu Sans, sans-serif">
<text x="145.0" y="18.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the 18-bit Unibus address space</text>
<rect x="70.0" y="28.0" width="150.0" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="145.0" y="55.0" font-size="13" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">I/O page</text>
<text x="145.0" y="67.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">top 8 KB: 0760000-0777777</text>
<rect x="70.0" y="84.0" width="150.0" height="120.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="145.0" y="143.0" font-size="13" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">memory</text>
<text x="145.0" y="155.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">up to 0757777</text>
<rect x="70.0" y="204.0" width="150.0" height="30.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="145.0" y="218.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">interrupt vectors</text>
<text x="145.0" y="230.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">0-0377</text>
<text x="64.0" y="36.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0777777</text>
<text x="64.0" y="240.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0</text>
<text x="480.0" y="18.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">an RK11 disk: six words at a fixed place</text>
<rect x="330.0" y="28.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="48.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKDS</text>
<text x="458.0" y="48.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">drive status (read only)</text>
<rect x="330.0" y="60.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKER</text>
<text x="458.0" y="80.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">error bits</text>
<rect x="330.0" y="92.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="112.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKCS</text>
<text x="458.0" y="112.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">control, status: GO, RDY, IDE</text>
<rect x="330.0" y="124.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="144.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKWC</text>
<text x="458.0" y="144.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">word count (negative)</text>
<rect x="330.0" y="156.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="176.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKBA</text>
<text x="458.0" y="176.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">bus address of the buffer</text>
<rect x="330.0" y="188.0" width="120.0" height="32.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="390.0" y="208.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">RKDA</text>
<text x="458.0" y="208.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">disk address</text>
<path d="M220.0,56.0 L314.0,56.0 L314.0,100.0 L328.0,100.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="328.0,100.0 320.0,103.6 320.0,96.4" fill="#222"/>
<text x="70.0" y="270.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">a driver holds one pointer, the address of RKDS; each register is a field</text>
<text x="70.0" y="286.0" font-size="10" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">(the wiring, the vector and the CSR address, was set by switches on the card)</text>
</svg>
