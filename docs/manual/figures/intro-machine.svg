<rect x="364.0" y="188.0" width="306.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="517.0" y="204.0" font-size="10.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">virtio-snd: the sound device</text>
<text x="517.0" y="216.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">chapter 3</text>
<path d="M348.0,205.0 L364.0,205.0" fill="none" stroke="#222" stroke-width="1.4"/>
