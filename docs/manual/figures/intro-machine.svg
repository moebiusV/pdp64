<text x="314.0" y="150.0" font-size="8.5" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">loads and stores</text>
<path d="M290.0,284.0 L348.0,284.0" fill="none" stroke="#222" stroke-width="1.4"/>
<text x="314.0" y="276.0" font-size="8.5" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">DMA (2)</text>
<text x="20.0" y="360.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">A device is a few memory locations that ordinary loads and stores reach (2.3): the PDP-11 had no input or output instructions either.</text>
<text x="20.0" y="376.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">Every standard device is a virtio device or a USB controller (5.3); the driver finds it by identifier, not by a switch setting (2.4).</text>
<text x="20.0" y="392.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">Starting: a ROM reads block 0 and jumps to it (4); the kernel then runs the machine (6); the instruction set is chapter 9.</text>
<text x="20.0" y="416.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">A box is a part and a line joins two parts that talk; this is the architecture as it is to be decided (section 1.2).</text>
</svg>
