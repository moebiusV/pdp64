<text x="155.0" y="283.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">memory: one address space, shared by every core</text>
<text x="155.0" y="295.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">sequentially consistent between cores (7); page tables (6)</text>
