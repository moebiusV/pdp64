<text x="517.0" y="244.0" font-size="10.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">USB controller</text>
<text x="517.0" y="256.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">keyboard and mouse (5)</text>
<path d="M348.0,245.0 L364.0,245.0" fill="none" stroke="#222" stroke-width="1.4"/>
<rect x="364.0" y="268.0" width="306.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="517.0" y="284.0" font-size="10.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">any other PCI Express card</text>
<text x="517.0" y="296.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">found by enumeration (2)</text>
<path d="M348.0,285.0 L364.0,285.0" fill="none" stroke="#222" stroke-width="1.4"/>
<rect x="364.0" y="308.0" width="306.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="517.0" y="324.0" font-size="10.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">accelerators for vector work</text>
<text x="517.0" y="336.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">devices, not units of the processor (8)</text>
