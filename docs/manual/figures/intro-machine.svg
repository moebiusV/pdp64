<text x="517.0" y="164.0" font-size="10.5" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">virtio-gpu: the display</text>
<text x="517.0" y="176.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">HDMI or another standard output (3)</text>
