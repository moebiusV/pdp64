<rect x="220" y="240" width="40" height="130" fill="#ddd" opacity="0.5"/>
<path d="M70.0,240.0 L220.0,370.0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="240.0" y="310.0" font-size="8" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">blank</text>
<rect x="410" y="240" width="40" height="130" fill="#ddd" opacity="0.5"/>
<path d="M260.0,240.0 L410.0,370.0" fill="none" stroke="#222" stroke-width="1.8"/>
<text x="430.0" y="310.0" font-size="8" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">blank</text>
<rect x="600" y="240" width="40" height="130" fill="#ddd" opacity="0.5"/>
