<svg xmlns="http://www.w3.org/2000/svg" width="690" height="450" viewBox="0 0 690 450" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="32.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">single buffer: the program draws frame N+1 into the picture being shown</text>
