<text x="620.0" y="310.0" font-size="8" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">blank</text>
<text x="100.0" y="232.0" font-size="8" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif"></text>
<text x="120.0" y="356.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">shows A</text>
<rect x="80" y="374" width="140" height="10" fill="#cfe3c9" opacity="0.6"/>
<text x="310.0" y="356.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">shows B</text>
<rect x="270" y="374" width="140" height="10" fill="#cfe3c9" opacity="0.6"/>
<text x="90.0" y="398.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">program draws into B while A is shown</text>
<path d="M240.0,240.0 L240.0,370.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="244.0" y="414.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">flip: base A to B, latched in the blank</text>
<text x="20.0" y="440.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Time runs to the right; a frame is about 16.7 ms at 60 Hz (an example rate). The slanted line is the display reading one row after another.</text>
</svg>
