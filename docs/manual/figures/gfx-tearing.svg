<text x="620.0" y="110.0" font-size="8" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">blank</text>
<text x="100.0" y="32.0" font-size="8" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif"></text>
<path d="M330.0,36.0 L330.0,174.0" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="338.0" y="58.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">the program writes the new frame here</text>
<rect x="330" y="40" width="6" height="130" fill="#f2b8a8" opacity="0.7"/>
<text x="380.0" y="188.0" font-size="9" text-anchor="end" fill="#333" font-family="DejaVu Sans, sans-serif">rows read before the write show frame N;</text>
<text x="380.0" y="200.0" font-size="9" text-anchor="end" fill="#333" font-family="DejaVu Sans, sans-serif">rows read after show frame N+1: a TEAR at the line</text>
<path d="M260.0,100.7 L410.0,100.7" fill="none" stroke="#222" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="414.0" y="104.7" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">tear</text>
<text x="20.0" y="232.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">double buffer: draw into the hidden picture; the base address changes in the blank</text>
<text x="62.0" y="244.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans, sans-serif">row 0</text>
<text x="62.0" y="374.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans, sans-serif">last row</text>
<path d="M70.0,240.0 L670.0,240.0" fill="none" stroke="#222" stroke-width="0.6"/>
