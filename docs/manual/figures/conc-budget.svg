<svg xmlns="http://www.w3.org/2000/svg" width="690" height="344" viewBox="0 0 690 344" font-family="DejaVu Sans, sans-serif">
<text x="345.0" y="16.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the estimated transistors of a core, excluding caches (about 92,000, an estimate)</text>
<text x="20.0" y="49.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">register file, 16 x 64 (earlier estimate)</text>
<rect x="300.0" y="37.0" width="58.2" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="364.2" y="50.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">6,000</text>
<text x="20.0" y="75.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">ALU, shifter, address adder</text>
<rect x="300.0" y="63.0" width="145.6" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="451.6" y="76.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">15,000</text>
<text x="20.0" y="101.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">decode and sequencer</text>
<rect x="300.0" y="89.0" width="63.1" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="369.1" y="102.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">6,500</text>
<text x="20.0" y="127.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">bit unit</text>
<rect x="300.0" y="115.0" width="34.0" height="18.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="340.0" y="128.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">3,500</text>
<text x="20.0" y="153.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">block-move sequencer</text>
<rect x="300.0" y="141.0" width="14.6" height="18.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="320.6" y="154.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">1,500</text>
<text x="20.0" y="179.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">UTF-8 decode and validity</text>
<rect x="300.0" y="167.0" width="11.6" height="18.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="317.6" y="180.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">1,200</text>
<text x="20.0" y="205.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">translation buffer, walker, windows</text>
<rect x="300.0" y="193.0" width="184.4" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="490.4" y="206.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">19,000</text>
<text x="20.0" y="231.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">floating-point unit with fused multiply-add</text>
<rect x="300.0" y="219.0" width="330.0" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="636.0" y="232.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">34,000</text>
<text x="20.0" y="257.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">control, status word, exceptions, undo buffer</text>
<rect x="300.0" y="245.0" width="53.4" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="359.4" y="258.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">5,500</text>
<text x="20.0" y="286.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The three blue bars (bit unit, block moves, UTF-8) add up to 6,200: under 7% of the total (10.2.2).</text>
<text x="20.0" y="302.0" font-size="9.5" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">A 32-register file would about double the first bar (inference); the decoder for the prefix code is not re-estimated.</text>
</svg>
