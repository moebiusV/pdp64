<text x="20.0" y="224.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">the write puts an invalidate on the bus; every other cache that holds the line drops it,</text>
<text x="20.0" y="238.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">and the next read of x by core 1 is a miss that is served by core 0 (the line is modified there)</text>
