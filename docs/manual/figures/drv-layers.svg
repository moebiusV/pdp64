<text x="20.0" y="350.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The raw interface skips the cache: rawrw -&gt; physio -&gt; strategy; on the pdp64 physio pins the pages and gives one descriptor per page (5.6, 5.10.2).</text>
<text x="20.0" y="364.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sources: V7 rk.c, 2.11BSD conf.c and vm_swp.c (read); OpenBSD vioblk.c, sd.c, conf.c (read).  Each layer of the right column is OpenBSD code; none is built for the pdp64.</text>
