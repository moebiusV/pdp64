<text x="250.0" y="61.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">... 64 passes: load, add, store, count down; one number each</text>
<text x="20.0" y="92.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">2. SIMD (MMX, SSE, AltiVec, NEON): one instruction, a fixed number of lanes</text>
<rect x="20.0" y="100.0" width="112.0" height="22.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="76.0" y="113.8" font-size="8" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">register of 4 lanes (128 bits)</text>
<rect x="24.0" y="124.0" width="25.0" height="14.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<rect x="51.0" y="124.0" width="25.0" height="14.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<rect x="78.0" y="124.0" width="25.0" height="14.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<rect x="105.0" y="124.0" width="25.0" height="14.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="150.0" y="118.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">64 numbers need 16 such adds, and a different instruction for 8 lanes (AVX) or 16 (AVX-512)</text>
<text x="150.0" y="132.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">the width is in the instruction, so a wider generation is a new instruction set</text>
<text x="20.0" y="172.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">3. vector machine (Cray-1, VAX vector facility): one instruction, a length in a register</text>
