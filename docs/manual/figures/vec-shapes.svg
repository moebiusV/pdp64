<text x="290.0" y="190.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">a register holds 64 numbers; VL says how many to use</text>
<text x="290.0" y="203.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">vadd v2, v0, v1 does all 64; a longer array is cut into pieces of 64</text>
<text x="20.0" y="240.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">4. device: a descriptor in memory names the operation, the arrays and the length</text>
<rect x="20.0" y="250.0" width="150.0" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="28.0" y="266.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">op: add</text>
<text x="28.0" y="278.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">a, b, c: addresses</text>
<text x="28.0" y="290.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">n = 64 (or 64 million)</text>
<text x="28.0" y="302.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">status: 0</text>
<rect x="210.0" y="250.0" width="110.0" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="265.0" y="277.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">device</text>
<text x="265.0" y="289.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">reads a and b, writes c</text>
<path d="M170.0,278.0 L210.0,278.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="210.0,278.0 202.0,281.6 202.0,274.4" fill="#222"/>
<text x="340.0" y="268.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">no register file in the processor; the length is a field,</text>
<text x="340.0" y="282.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">so one descriptor serves any size (8.5.4)</text>
<text x="340.0" y="296.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">the price: a descriptor to build and a status to wait for</text>
<text x="20.0" y="340.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The descriptor drawn is an illustration; its format is open (8.4.7).</text>
<text x="20.0" y="354.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Machines 1 and 2 as described in 8.1 and 8.2: the V7 sources and the Linux headers were read, the rest is unverified.</text>
</svg>
