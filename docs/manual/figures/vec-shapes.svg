<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">c = a + b over 64 numbers: four shapes</text>
<text x="20.0" y="40.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">1. scalar loop (PDP-11 with the FP11)</text>
