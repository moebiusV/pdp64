<text x="165.0" y="236.0" font-size="10" text-anchor="middle" fill="#a33" font-family="DejaVu Sans, sans-serif" font-weight="bold">both cores now hold the lock</text>
<text x="520.0" y="236.0" font-size="10" text-anchor="middle" fill="#2a6a2a" font-family="DejaVu Sans, sans-serif" font-weight="bold">exactly one core holds it at any time</text>
<text x="165.0" y="254.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">correct on one core only because nothing runs between the test and the set</text>
<text x="520.0" y="254.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">SWAP (or CAS) on the lock word; the memory system makes it indivisible</text>
