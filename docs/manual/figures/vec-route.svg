<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the route of one request to an accelerator device (an illustration of 8.4)</text>
<rect x="20.0" y="56.0" width="150.0" height="60.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="85.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">processor</text>
<text x="95.0" y="97.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">ordinary loads and stores</text>
<rect x="270.0" y="48.0" width="200.0" height="150.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="370.0" y="64.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">RAM (uncached for the device)</text>
<rect x="280.0" y="72.0" width="180.0" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="370.0" y="91.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">descriptor</text>
<text x="370.0" y="103.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">op, array addresses, length, status</text>
<rect x="280.0" y="122.0" width="84.0" height="66.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="322.0" y="154.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">arrays a, b</text>
<text x="322.0" y="166.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the inputs</text>
<rect x="376.0" y="122.0" width="84.0" height="66.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="418.0" y="154.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">array c</text>
<text x="418.0" y="166.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the result</text>
<rect x="580.0" y="56.0" width="90.0" height="60.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="625.0" y="85.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">device</text>
<text x="625.0" y="97.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the accelerator</text>
<path d="M170.0,80.0 L270.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="270.0,80.0 262.0,83.6 262.0,76.4" fill="#222"/>
<text x="220.0" y="74.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">1 fill</text>
<path d="M95.0,56.0 L95.0,34.0 L625.0,34.0 L625.0,56.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="625.0,56.0 621.4,48.0 628.6,48.0" fill="#222"/>
<text x="360.0" y="29.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">3 doorbell: a store to an address of the device</text>
<path d="M470.0,90.0 L580.0,90.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="580.0,90.0 572.0,93.6 572.0,86.4" fill="#222"/>
<text x="525.0" y="84.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">4 device reads</text>
<path d="M580.0,150.0 L470.0,150.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="470.0,150.0 478.0,146.4 478.0,153.6" fill="#222"/>
<text x="525.0" y="144.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">5 device writes</text>
<path d="M270.0,104.0 L170.0,104.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="170.0,104.0 178.0,100.4 178.0,107.6" fill="#222"/>
<text x="220.0" y="120.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">6 reads status</text>
<text x="20.0" y="140.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">2 FENCE: the descriptor is</text>
<text x="20.0" y="153.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">visible before the doorbell</text>
<text x="20.0" y="226.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">PDP-11: the same shape as the RK11 with its registers replaced by a record in memory (5.1): the program</text>
<text x="20.0" y="241.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">   fills it, starts the device, and learns by the RDY bit or an interrupt.</text>
<text x="20.0" y="256.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">pdp64: the record is in memory and can chain; the device reads it and the arrays by DMA (direct memory access:</text>
<text x="20.0" y="271.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">   the device moves data without the processor) and writes the result and a status.</text>
<text x="20.0" y="286.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">The processor owes the device two things: memory the device sees in order, and FENCE (8.4.3).</text>
<text x="20.0" y="301.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">The instruction set is unchanged. Whether the record is a virtio descriptor, or one that points at it, is open (8.4.4).</text>
<text x="20.0" y="342.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sources: V7 rk.c (read), chapter 5 (5.4, 5.10), chapter 2 (2.5).</text>
</svg>
