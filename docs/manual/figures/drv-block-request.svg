<svg xmlns="http://www.w3.org/2000/svg" width="690" height="420" viewBox="0 0 690 420" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the life of one block request (a read of one sector) on the pdp64</text>
<text x="20.0" y="40.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the two rings</text>
<rect x="20.0" y="330.0" width="190.0" height="56.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="115.0" y="343.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">header (16 bytes)</text>
<text x="30.0" y="357.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">type 0 = read</text>
<text x="30.0" y="368.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">ioprio 0</text>
<text x="30.0" y="379.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">sector 12</text>
<rect x="250.0" y="330.0" width="190.0" height="56.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="343.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">data buffer (512 bytes)</text>
<text x="260.0" y="357.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the device writes it</text>
<text x="260.0" y="368.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">(WRITE flag set)</text>
<rect x="480.0" y="330.0" width="190.0" height="56.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="575.0" y="343.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">status (1 byte)</text>
<text x="490.0" y="357.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">0 OK, 1 I/O error</text>
<text x="490.0" y="368.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">2 unsupported</text>
<rect x="20.0" y="230.0" width="190.0" height="52.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="115.0" y="246.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">desc[0]: addr, len, flags, next</text>
<text x="30.0" y="262.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">len 16, NEXT</text>
<text x="30.0" y="275.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">next = 1</text>
<path d="M115.0,282.0 L115.0,330.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="115.0,330.0 111.4,322.0 118.6,322.0" fill="#222"/>
<rect x="250.0" y="230.0" width="190.0" height="52.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="246.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">desc[1]: addr, len, flags, next</text>
<text x="260.0" y="262.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">len 512, NEXT|WRITE</text>
<text x="260.0" y="275.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">next = 2</text>
<path d="M345.0,282.0 L345.0,330.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="345.0,330.0 341.4,322.0 348.6,322.0" fill="#222"/>
<rect x="480.0" y="230.0" width="190.0" height="52.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="575.0" y="246.0" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">desc[2]: addr, len, flags, next</text>
<text x="490.0" y="262.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">len 1, WRITE</text>
<text x="490.0" y="275.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">end</text>
<path d="M575.0,282.0 L575.0,330.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="575.0,330.0 571.4,322.0 578.6,322.0" fill="#222"/>
<path d="M210.0,256.0 L250.0,256.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="250.0,256.0 242.0,259.6 242.0,252.4" fill="#222"/>
<path d="M440.0,256.0 L480.0,256.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="480.0,256.0 472.0,259.6 472.0,252.4" fill="#222"/>
<text x="20.0" y="220.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the descriptor table (three descriptors chained by next) and the buffers they point to</text>
<rect x="20.0" y="52.0" width="300.0" height="46.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="30.0" y="68.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">available ring (the driver writes)</text>
<text x="30.0" y="84.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">idx = 1    ring[0] = 0  (head: desc[0])</text>
<rect x="370.0" y="52.0" width="300.0" height="46.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="380.0" y="68.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">used ring (the device writes)</text>
<text x="380.0" y="84.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">idx = 1    ring[0] = { id 0, len 513 }</text>
<text x="20.0" y="120.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">1  the driver fills the header and the three descriptors</text>
<text x="20.0" y="135.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">2  it writes the head (0) into the available ring, executes FENCE, then adds 1 to its idx</text>
<text x="20.0" y="150.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">3  it writes the queue's notification address (the doorbell; FENCE ordered)</text>
<text x="20.0" y="165.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">4  the device reads the chain, moves the sector into the buffer, writes the status byte</text>
<text x="20.0" y="180.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">5  it writes { id, len } in the used ring, then adds 1 to the used idx</text>
<text x="20.0" y="195.0" font-size="9.5" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">6  an interrupt (or the driver polling used.idx) lets the driver read the status, free the chain, iodone(bp)</text>
<text x="20.0" y="408.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sizes and flags as in chapter 2 (2.7.5 to 2.7.7) and virtio_blk.h; the numbers 12 and 513 are an example.  The data is written before the used entry before the used idx (5.10.3).</text>
</svg>
