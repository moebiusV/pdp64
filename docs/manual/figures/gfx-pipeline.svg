<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the graphics pipeline: data goes in at the left, pixels come out at the right</text>
<rect x="10.0" y="50.0" width="110.0" height="60.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="65.0" y="83.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">vertices</text>
<rect x="150.0" y="50.0" width="110.0" height="60.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="205.0" y="83.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">vertex shader</text>
<rect x="290.0" y="50.0" width="110.0" height="60.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="83.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">rasterizer</text>
<rect x="430.0" y="50.0" width="110.0" height="60.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="485.0" y="83.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">pixel shader</text>
<rect x="570.0" y="50.0" width="110.0" height="60.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="625.0" y="83.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">framebuffer</text>
<text x="65.0" y="124.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">a list of</text>
<text x="65.0" y="136.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">points in memory</text>
<text x="205.0" y="124.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">a small program, run</text>
<text x="205.0" y="136.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">once per vertex</text>
<text x="345.0" y="124.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">fixed hardware: which pixels</text>
<text x="345.0" y="136.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">does each triangle cover?</text>
<text x="485.0" y="124.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">a small program, run</text>
<text x="485.0" y="136.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">once per pixel</text>
<text x="625.0" y="124.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">the colour of each</text>
<text x="625.0" y="136.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">pixel, blended in</text>
<path d="M120.0,80.0 L150.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="150.0,80.0 142.0,83.6 142.0,76.4" fill="#222"/>
<path d="M260.0,80.0 L290.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="290.0,80.0 282.0,83.6 282.0,76.4" fill="#222"/>
<path d="M400.0,80.0 L430.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="430.0,80.0 422.0,83.6 422.0,76.4" fill="#222"/>
<path d="M540.0,80.0 L570.0,80.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="570.0,80.0 562.0,83.6 562.0,76.4" fill="#222"/>
<rect x="430.0" y="190.0" width="110.0" height="40.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="485.0" y="209.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">texture</text>
<text x="485.0" y="221.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">an image the shader may read</text>
<path d="M485.0,190.0 L485.0,144.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="485.0,144.0 488.6,152.0 481.4,152.0" fill="#222"/>
<rect x="150.0" y="190.0" width="110.0" height="40.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="205.0" y="209.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">uniforms</text>
<text x="205.0" y="221.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">numbers shared by all</text>
<path d="M205.0,190.0 L205.0,144.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="205.0,144.0 208.6,152.0 201.4,152.0" fill="#222"/>
<text x="20.0" y="270.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">Every vertex goes through the same program at the same time on different lanes; so does every pixel.</text>
<text x="20.0" y="286.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">The programmer writes the two shaders (pink); the rasterizer between them is fixed.</text>
<text x="20.0" y="304.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">This is the model of general knowledge of current GPUs (unverified here, 3.19); stages such as geometry and tessellation are left out.</text>
</svg>
