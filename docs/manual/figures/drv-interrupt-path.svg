<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the interrupt path from the device to the handler</text>
<text x="20.0" y="38.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">PDP-11</text>
<rect x="20.0" y="48.0" width="108.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="74.0" y="69.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">RK11 done</text>
<text x="74.0" y="81.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">asserts BR5</text>
<path d="M128.0,70.0 L150.0,70.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="150.0,70.0 142.0,73.6 142.0,66.4" fill="#222"/>
<rect x="150.0" y="48.0" width="108.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="204.0" y="69.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">processor</text>
<text x="204.0" y="81.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">priority below 5?</text>
<path d="M258.0,70.0 L280.0,70.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="280.0,70.0 272.0,73.6 272.0,66.4" fill="#222"/>
<rect x="280.0" y="48.0" width="108.0" height="44.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="334.0" y="69.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">vector 0220</text>
<text x="334.0" y="81.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">new PC and PS (br5)</text>
<path d="M388.0,70.0 L410.0,70.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="410.0,70.0 402.0,73.6 402.0,66.4" fill="#222"/>
<rect x="410.0" y="48.0" width="108.0" height="44.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="464.0" y="69.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">rkintr</text>
<text x="464.0" y="81.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">reads RKCS, iodone</text>
<path d="M518.0,70.0 L540.0,70.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="540.0,70.0 532.0,73.6 532.0,66.4" fill="#222"/>
<rect x="540.0" y="48.0" width="108.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="594.0" y="69.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">RTI</text>
<text x="594.0" y="81.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">old PC and PS back</text>
<text x="20.0" y="132.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">pdp64</text>
<rect x="20.0" y="142.0" width="108.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="74.0" y="163.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">device writes</text>
<text x="74.0" y="175.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">address, data (MSI-X)</text>
<path d="M128.0,164.0 L150.0,164.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="150.0,164.0 142.0,167.6 142.0,160.4" fill="#222"/>
<rect x="150.0" y="142.0" width="108.0" height="44.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="204.0" y="163.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">interrupt controller</text>
<text x="204.0" y="175.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">not specified (R1)</text>
<path d="M258.0,164.0 L280.0,164.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="280.0,164.0 272.0,167.6 272.0,160.4" fill="#222"/>
<rect x="280.0" y="142.0" width="108.0" height="44.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="334.0" y="163.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">core: vector n</text>
<text x="334.0" y="175.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">ECAUSE = n; priority 7</text>
<path d="M388.0,164.0 L410.0,164.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="410.0,164.0 402.0,167.6 402.0,160.4" fill="#222"/>
<rect x="410.0" y="142.0" width="108.0" height="44.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="464.0" y="163.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">handler at VBR+8n</text>
<text x="464.0" y="175.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">reads the used ring</text>
<path d="M518.0,164.0 L540.0,164.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="540.0,164.0 532.0,167.6 532.0,160.4" fill="#222"/>
<rect x="540.0" y="142.0" width="108.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="594.0" y="163.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">RTI</text>
<text x="594.0" y="175.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">EPC, EPSW back</text>
<text x="20.0" y="218.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">PDP-11: a wire and a level shared by every device on it; the vector was set by switches on the card; the handler asks the CSR what happened.</text>
<text x="20.0" y="233.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">pdp64: a memory write that cannot pass the data written before it (5.9.4); one vector for each queue; the handler asks the used ring.</text>
<text x="20.0" y="248.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">The dashed box is open: which unit receives the write, how a core is chosen and how the vector number is made are decision R1 (appendix B, 2.6.3).</text>
<text x="20.0" y="290.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sources: 2.11BSD pdp/scb.s (DEVTRAP(220, rkintr, br5)); chapter 6 (6.3.1 to 6.3.6) for the entry; chapter 2 (2.6) for MSI-X.</text>
<text x="20.0" y="304.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The priority of 7 on entry is the PDP-11's own habit (errata 40); the handler lowers it with SPL.</text>
</svg>
