<text x="482.0" y="200.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">the offset is used as it is:</text>
<text x="482.0" y="213.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">frame address + bits 11-0</text>
<text x="20.0" y="396.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">Each table is 512 entries x 8 bytes = 4 KB.  PTBR holds the physical address of the top table.</text>
<text x="20.0" y="410.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">With four levels bits 47-39 index a level-3 table above these; with five, bits 56-48 index a level-4 table above that.</text>
<text x="20.0" y="424.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">A leaf found at level 1 maps 2 MB and ends the walk there; a leaf at level 2 maps 1 GB.</text>
