<svg xmlns="http://www.w3.org/2000/svg" width="690" height="300" viewBox="0 0 690 300" font-family="DejaVu Sans, sans-serif">
<text x="345.0" y="16.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">one instruction word of the PDP-11, and the same kind of instruction on the pdp64</text>
<text x="20.0" y="40.0" font-size="10.5" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">PDP-11:  mov (r1)+,(r0)+   = 012120 octal, 16 bits, memory to memory</text>
<rect x="20.0" y="50.0" width="76.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="58.0" y="70.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">opcode 01</text>
<rect x="96.0" y="50.0" width="57.0" height="34.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="124.5" y="70.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">mode 2</text>
<rect x="153.0" y="50.0" width="57.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="181.5" y="70.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">reg 1</text>
<rect x="210.0" y="50.0" width="57.0" height="34.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="238.5" y="70.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">mode 2</text>
<rect x="267.0" y="50.0" width="57.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="295.5" y="70.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">reg 0</text>
<text x="20.0" y="100.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">source: mode 2 is autoincrement, register 1;  destination: mode 2, register 0;  an extra word follows only for the modes 6 and 7,</text>
<text x="20.0" y="112.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">and for modes 2 and 3 on register 7 (immediate, absolute); so the length, 2, 4 or 6 bytes, depends on both six-bit fields.</text>
<text x="20.0" y="144.0" font-size="10.5" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">pdp64:  movq (r1)+, r0   = 2 parcels of 16 bits (4 bytes), one memory operand</text>
<rect x="20.0" y="154.0" width="114.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="77.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">prefix 011111</text>
<rect x="134.0" y="154.0" width="76.0" height="34.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="172.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">sub-op</text>
<rect x="210.0" y="154.0" width="19.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="219.5" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">b</text>
<rect x="229.0" y="154.0" width="95.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="276.5" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">rd: 5</text>
<rect x="344.0" y="154.0" width="76.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="382.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">b: 4</text>
<rect x="420.0" y="154.0" width="228.0" height="34.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="534.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">stride: 12</text>
<text x="172.0" y="204.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">first parcel</text>
<text x="496.0" y="204.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">second parcel</text>
<text x="20.0" y="226.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">prefix: a bit pattern that no other prefix begins; it alone says which instruction this is and that it is two parcels long (9.1).</text>
<text x="20.0" y="238.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">sub-op: which of the sixteen operations of this form (here movq); b: the five bits of the base register, one in the first parcel and four in the second;</text>
<text x="20.0" y="250.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">rd: the destination register, five bits because there are thirty-two; stride: how far the base register moves afterwards, 0 meaning the size of the access.</text>
<text x="20.0" y="272.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The PDP-11 word is read from the handbook (11/70, section 3.2); the pdp64 fields are the leaf LDF.PI12 of the grammar (dictionary/by-encoding.md).</text>
<text x="20.0" y="288.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The assembler spells the pdp64 instruction as shown in the heading of this figure (appendix E).</text>
</svg>
