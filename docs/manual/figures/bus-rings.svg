<text x="345.0" y="266.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">The driver offers a chain by writing its head into ring[idx mod size] and then adding 1 to idx.</text>
<text x="345.0" y="282.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">The device reports it done by writing (head, bytes written) into the used ring and then adding 1 to its idx.</text>
<text x="345.0" y="298.0" font-size="10" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">Each side keeps its own private count of how far it has read the other side's ring. Indices are examples.</text>
