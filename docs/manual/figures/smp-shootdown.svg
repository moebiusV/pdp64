<svg xmlns="http://www.w3.org/2000/svg" width="690" height="262" viewBox="0 0 690 262" font-family="DejaVu Sans, sans-serif">
<text x="165.0" y="16.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">by software: Linux 2.6.33, x86</text>
<text x="520.0" y="16.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">pdp64: broadcast and wait</text>
<path d="M345.0,24.0 L345.0,255.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<rect x="20.0" y="30.0" width="310.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="47.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">1  change the page-table entry</text>
<rect x="20.0" y="66.0" width="310.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="83.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">2  take the lock of one of 8 IPI vectors</text>
<rect x="20.0" y="102.0" width="310.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="119.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">3  write the mm and address, set the mask of cores</text>
<rect x="20.0" y="138.0" width="310.0" height="28.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="155.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">4  send an inter-processor interrupt to them</text>
<rect x="20.0" y="174.0" width="310.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="191.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">5  each core runs its handler: invalidate, clear its bit</text>
<rect x="20.0" y="210.0" width="310.0" height="28.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="175.0" y="227.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">6  spin until the mask is empty; unlock</text>
<rect x="365.0" y="30.0" width="305.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="517.5" y="47.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">1  change the page-table entry</text>
<rect x="365.0" y="66.0" width="305.0" height="28.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="517.5" y="83.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">2  TLBI rN   (every core drops the translation)</text>
<rect x="365.0" y="102.0" width="305.0" height="28.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="517.5" y="119.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">3  TLBSYNC   (wait until every core has)</text>
<text x="365.0" y="156.0" font-size="10" text-anchor="start" fill="#2a6a2a" font-family="DejaVu Sans, sans-serif" font-weight="bold">three lines of kernel code, no interrupt, no lock, no handler</text>
<text x="365.0" y="174.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">a core that is running with interrupts masked is still</text>
<text x="365.0" y="187.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">reached: the hardware delivers the invalidate, not an interrupt</text>
<text x="365.0" y="215.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">the kernel half is global or window-mapped, so a kernel</text>
<text x="365.0" y="228.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">mapping never takes part in a shootdown (7.8.3)</text>
</svg>
