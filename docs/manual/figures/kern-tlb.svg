<text x="20.0" y="312.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">TLBI rN drops the entry for one page (this ASID and the global ones); TLBIA drops all; both reach every core; TLBSYNC waits until all have finished.</text>
<text x="20.0" y="326.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The size and organisation are the implementation's choice (section 6.8).</text>
