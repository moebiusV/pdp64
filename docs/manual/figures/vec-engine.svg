<text x="40.0" y="346.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif">a standard part: specified by the manual, present in every system (8.4.1, 8.4.2)</text>
<text x="20.0" y="362.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The engine is a bus device and an architectural component at once; every access it makes goes through the IOMMU.</text>
