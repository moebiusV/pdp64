<text x="20.0" y="322.0" font-size="9.5" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">If OpenBSD proves too hard, a port of Unix/32V is the fallback; it would give a shell on the emulator and no ssh (10.5.3).</text>
