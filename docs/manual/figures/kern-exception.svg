<svg xmlns="http://www.w3.org/2000/svg" width="690" height="360" viewBox="0 0 690 360" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">entering the kernel: only registers are written, then one memory read</text>
<text x="20.0" y="38.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">before</text>
<rect x="20.0" y="44.0" width="120.0" height="30.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="80.0" y="58.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">PSW</text>
<text x="80.0" y="70.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">mode, priority, flags</text>
<rect x="20.0" y="80.0" width="120.0" height="30.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="80.0" y="94.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">PC</text>
<text x="80.0" y="106.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">this or next instruction</text>
<rect x="20.0" y="116.0" width="120.0" height="30.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="80.0" y="130.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">address</text>
<text x="80.0" y="142.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">(aborts only)</text>
<rect x="20.0" y="152.0" width="120.0" height="30.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="80.0" y="166.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">vector number</text>
<text x="80.0" y="178.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">what happened</text>
<text x="205.0" y="38.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">saved in</text>
<rect x="200.0" y="44.0" width="90.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="62.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">EPSW</text>
<rect x="200.0" y="80.0" width="90.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="98.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">EPC</text>
<rect x="200.0" y="116.0" width="90.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="134.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">EVA</text>
<rect x="200.0" y="152.0" width="90.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="170.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">ECAUSE</text>
<path d="M140.0,59.0 L200.0,59.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="200.0,59.0 192.0,62.6 192.0,55.4" fill="#222"/>
<path d="M140.0,95.0 L200.0,95.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="200.0,95.0 192.0,98.6 192.0,91.4" fill="#222"/>
<path d="M140.0,131.0 L200.0,131.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="200.0,131.0 192.0,134.6 192.0,127.4" fill="#222"/>
<path d="M140.0,167.0 L200.0,167.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="200.0,167.0 192.0,170.6 192.0,163.4" fill="#222"/>
<text x="20.0" y="206.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the new PSW:</text>
<text x="20.0" y="220.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">current mode = kernel; previous mode = the old current mode;</text>
<text x="20.0" y="232.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">priority = 7; trace bit, flags and the user-access guard cleared</text>
<text x="20.0" y="252.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the new PC = the 64-bit word at VBR + 8 x vector</text>
<text x="20.0" y="268.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the hardware pushes nothing; a handler that may be interrupted</text>
<text x="20.0" y="280.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">saves EPC and EPSW with PUSHX, lowers the priority with SPL,</text>
<text x="20.0" y="292.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">and leaves with POPX and RTI (PC from EPC, PSW from EPSW).</text>
<text x="520.0" y="36.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the vector table: 512 entries x 8 bytes = 4096 bytes</text>
<rect x="350.0" y="44.0" width="90.0" height="28.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="395.0" y="57.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">VBR</text>
<text x="395.0" y="69.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">system register</text>
<rect x="440.0" y="90.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="107.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0</text>
<rect x="490.0" y="90.0" width="200.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="107.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">reset</text>
<rect x="440.0" y="118.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="135.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">1</text>
<rect x="490.0" y="118.0" width="200.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="135.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">machine check</text>
<rect x="440.0" y="146.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="163.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">2-5</text>
<rect x="490.0" y="146.0" width="200.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="163.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">illegal, privileged, align, non-canon.</text>
<rect x="440.0" y="174.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="191.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">6-8</text>
<rect x="490.0" y="174.0" width="200.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="191.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">instruction, load, store page fault</text>
<rect x="440.0" y="202.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="219.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">9-11</text>
<rect x="490.0" y="202.0" width="200.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="219.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">protection violation</text>
<rect x="440.0" y="230.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="247.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">12-15</text>
<rect x="490.0" y="230.0" width="200.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="247.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">divide, bus fault, landing pad, break</text>
<rect x="440.0" y="258.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="275.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">32-63</text>
<rect x="490.0" y="258.0" width="200.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="275.1" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">interrupts (32 timer, 33-34 console)</text>
<rect x="440.0" y="286.0" width="50.0" height="28.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="465.0" y="303.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">256+n</text>
<rect x="490.0" y="286.0" width="200.0" height="28.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="590.0" y="303.1" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">TRAP #n  (system calls)</text>
<path d="M440.0,58.0 L465.0,58.0 L465.0,88.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="465.0,88.0 461.4,80.0 468.6,80.0" fill="#222"/>
<text x="440.0" y="326.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">entry n is at VBR + 8 x n; ECAUSE = n</text>
<text x="440.0" y="339.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">the vectors in full: statement 6.3.6</text>
