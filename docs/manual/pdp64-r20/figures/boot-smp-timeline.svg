<text x="20.0" y="178.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">core 1</text>
<path d="M86.0,184.0 L672.0,184.0" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="20.0" y="234.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">core 2</text>
<path d="M86.0,240.0 L672.0,240.0" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="5 3"/>
<rect x="86.0" y="46.0" width="70.0" height="26.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="121.0" y="58.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">ROM</text>
<text x="121.0" y="70.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">reads block 0</text>
<rect x="160.0" y="46.0" width="70.0" height="26.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="195.0" y="62.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">block 0</text>
<rect x="234.0" y="46.0" width="90.0" height="26.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="279.0" y="62.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">second stage</text>
<rect x="328.0" y="46.0" width="150.0" height="26.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="403.0" y="62.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">kernel: tables, bus, clock</text>
<rect x="482.0" y="46.0" width="90.0" height="26.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="527.0" y="58.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">write start</text>
<text x="527.0" y="70.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">register 1</text>
<rect x="576.0" y="46.0" width="96.0" height="26.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="624.0" y="58.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">write start</text>
<text x="624.0" y="70.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">register 2</text>
<rect x="86.0" y="102.0" width="200.0" height="26.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="186.0" y="118.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">every core but core 0 held in reset</text>
<rect x="482.0" y="102.0" width="90.0" height="26.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="527.0" y="114.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">release core 1</text>
<text x="527.0" y="126.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">entry, argument</text>
<rect x="576.0" y="102.0" width="96.0" height="26.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="624.0" y="114.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">release core 2</text>
<text x="624.0" y="126.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">entry, argument</text>
<rect x="86.0" y="158.0" width="396.0" height="26.0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="284.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">in reset: not running, no state</text>
<rect x="482.0" y="158.0" width="90.0" height="26.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="527.0" y="170.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel mode</text>
<text x="527.0" y="182.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r0 = 1, r1 = arg</text>
<rect x="86.0" y="214.0" width="490.0" height="26.0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="331.0" y="230.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">in reset</text>
<rect x="576.0" y="214.0" width="96.0" height="26.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="624.0" y="226.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel mode</text>
<text x="624.0" y="238.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r0 = 2, r1 = arg</text>
<path d="M527.0,72.0 L527.0,102.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="527.0,102.0 523.4,94.0 530.6,94.0" fill="#222"/>
<path d="M624.0,72.0 L624.0,102.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="624.0,102.0 620.4,94.0 627.6,94.0" fill="#222"/>
<path d="M527.0,128.0 L527.0,158.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="527.0,158.0 523.4,150.0 530.6,150.0" fill="#222"/>
<path d="M624.0,128.0 L624.0,214.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="624.0,214.0 620.4,206.0 627.6,206.0" fill="#222"/>
<text x="86.0" y="258.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">time runs to the right (not to scale); priority 7 on entry.  The entry address is where the kernel's per-core</text>
<text x="86.0" y="270.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">code starts; the argument is a pointer to that core's own structure.  A core that sticks is reset by a write to</text>
<text x="86.0" y="282.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">a core-reset register of the controller and started again (4.7.2).</text>
<text x="20.0" y="306.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">x86, for comparison (general knowledge and Linux smpboot.c, 4.7): the boot core sends INIT and START-UP signals through the interrupt controller;</text>
<text x="20.0" y="317.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">the other core wakes in 16-bit real mode at an address below 1 MB, and a trampoline must walk it through protected mode into 64-bit mode.</text>
<text x="20.0" y="340.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The pdp64 has no such ladder: a core starts in its normal mode at any address.  What the start registers look like is proposed, not decided (4.7.1);</text>
<text x="20.0" y="353.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">the register block's address is open (4.12); the SMP chapter (7.8.1) names r0 only, where 4.7.1 loads r1 too.</text>
</svg>
