<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">starting the other cores: one register write each, then the core is a core</text>
<text x="20.0" y="66.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">core 0</text>
<path d="M86.0,72.0 L672.0,72.0" fill="none" stroke="#222" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="20.0" y="122.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">controller</text>
