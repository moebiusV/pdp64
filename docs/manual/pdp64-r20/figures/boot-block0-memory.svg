<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the instant core 0 starts: block 0 is in memory, one core runs, the rest are in reset</text>
<rect x="130.0" y="30.0" width="230.0" height="30.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="44.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">RAM, and the windows of devices</text>
<text x="245.0" y="56.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">no window in the first few pages</text>
<rect x="130.0" y="60.0" width="230.0" height="40.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="79.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">loaded later: second stage, kernel</text>
<text x="245.0" y="91.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">above the first 64 KB (illustration)</text>
<rect x="130.0" y="100.0" width="230.0" height="50.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="124.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">stack</text>
<text x="245.0" y="136.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r14 = the top of the first 64 KB; grows down</text>
<rect x="130.0" y="150.0" width="230.0" height="36.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="167.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot-information block</text>
<text x="245.0" y="179.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">r1 points here; place not specified</text>
<rect x="130.0" y="186.0" width="230.0" height="42.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="206.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">block 0: 512 bytes from the disk</text>
<text x="245.0" y="218.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">0x1000 (an address still to be chosen)</text>
<rect x="130.0" y="228.0" width="230.0" height="74.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="245.0" y="264.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">vector table: one page</text>
<text x="245.0" y="276.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">512 x 8 bytes = 4096 bytes; VBR = 0</text>
<text x="122.0" y="108.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x10000</text>
<text x="122.0" y="197.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x1200</text>
<text x="122.0" y="232.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x1000</text>
<text x="122.0" y="308.0" font-size="9" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0</text>
<path d="M76.0,150.0 L68.0,150.0 L68.0,302.0 L76.0,302.0" fill="none" stroke="#222" stroke-width="1.2"/>
<text x="62.0" y="222.0" font-size="9" text-anchor="end" fill="#222" font-family="DejaVu Sans, sans-serif">the first</text>
<text x="62.0" y="234.0" font-size="9" text-anchor="end" fill="#222" font-family="DejaVu Sans, sans-serif">few pages</text>
<text x="420.0" y="40.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">core 0 at that instant</text>
<rect x="420.0" y="50.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="65.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">PC</text>
<rect x="470.0" y="50.0" width="70.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="65.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0x1000</text>
<text x="548.0" y="66.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">the first instruction of block 0</text>
<rect x="420.0" y="76.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="91.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">r0</text>
<rect x="470.0" y="76.0" width="70.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="91.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">device</text>
<text x="548.0" y="92.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">the boot device number</text>
<rect x="420.0" y="102.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="117.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">r1</text>
<rect x="470.0" y="102.0" width="70.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="117.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">address</text>
<text x="548.0" y="118.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">of the boot-information block</text>
<rect x="420.0" y="128.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="143.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">r14</text>
<rect x="470.0" y="128.0" width="70.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="143.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0x10000</text>
<text x="548.0" y="144.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">top of the first 64 KB</text>
<rect x="420.0" y="154.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="169.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">others</text>
<rect x="470.0" y="154.0" width="70.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="505.0" y="169.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0</text>
<text x="548.0" y="170.0" font-size="9" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">zero</text>
<text x="420.0" y="198.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">mode: kernel, priority 7, translation off:</text>
<text x="420.0" y="210.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">every address is a physical address;</text>
<text x="420.0" y="222.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the user-memory guard is clear</text>
<path d="M370.0,207.0 L414.0,207.0 L414.0,66.0 L418.0,66.0" fill="none" stroke="#222" stroke-width="0.9" stroke-dasharray="5 3"/>
<polygon points="418.0,66.0 410.0,69.6 410.0,62.4" fill="#222"/>
<text x="420.0" y="252.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the other cores: held in reset by the</text>
<text x="420.0" y="264.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">controller until core 0 writes their</text>
<text x="420.0" y="276.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">start registers (4.7)</text>
<text x="20.0" y="340.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">0x1000 and the 64 KB stack top follow the proposal of 4.4 and the figure of chapter 6; how many pages are reserved is not decided (errata 102).</text>
<text x="20.0" y="354.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">Not to scale.  The ROM itself is not in this memory: it sits in the controller chip, outside the address space the kernel uses.</text>
<text x="20.0" y="368.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">On the PDP-11 the vectors sat at 0 to 0377 and the bootstrap was loaded elsewhere, often high in memory (4.1).</text>
</svg>
