<svg xmlns="http://www.w3.org/2000/svg" width="690" height="300" viewBox="0 0 690 300" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">a page-table entry: 64 bits, the physical page number in place</text>
<rect x="20.0" y="56.0" width="133.2" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="86.6" y="79.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">reserved, zero</text>
<text x="86.6" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">63-40</text>
<rect x="153.2" y="56.0" width="214.4" height="40.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="260.4" y="79.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">physical page number (PPN)</text>
<text x="260.4" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">39-12</text>
<rect x="367.6" y="56.0" width="42.9" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="389.0" y="79.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">rsvd</text>
<text x="389.0" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">11-10</text>
<rect x="410.5" y="56.0" width="42.9" height="40.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="431.9" y="79.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">MT</text>
<text x="431.9" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">9-8</text>
<rect x="453.3" y="56.0" width="27.1" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="466.9" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">D</text>
<text x="466.9" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">7</text>
<rect x="480.4" y="56.0" width="27.1" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="494.0" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">A</text>
<text x="494.0" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">6</text>
<rect x="507.5" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="521.0" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">G</text>
<text x="521.0" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">5</text>
<rect x="534.6" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="548.1" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">U</text>
<text x="548.1" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">4</text>
<rect x="561.7" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="575.2" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">X</text>
<text x="575.2" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">3</text>
<rect x="588.8" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="602.3" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">W</text>
<text x="602.3" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">2</text>
<rect x="615.8" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="629.4" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">R</text>
<text x="629.4" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">1</text>
<rect x="642.9" y="56.0" width="27.1" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="656.5" y="80.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">V</text>
<text x="656.5" y="50.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">0</text>
<text x="24.0" y="132.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">V</text>
<text x="90.0" y="132.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">valid: the entry means something; clear is a page fault</text>
<text x="24.0" y="154.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">R W X</text>
<text x="90.0" y="154.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">read, write, execute; all three clear means "pointer to the next table"; W without R is reserved</text>
<text x="24.0" y="176.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">U</text>
<text x="90.0" y="176.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">user: user mode may touch it (kernel mode may read and write a user page, never execute one)</text>
<text x="24.0" y="198.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">G</text>
<text x="90.0" y="198.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">global: the entry ignores the address-space number</text>
<text x="24.0" y="220.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">A  D</text>
<text x="90.0" y="220.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">accessed, dirty: set by the kernel, never by the hardware; a clear bit is a page fault</text>
<text x="24.0" y="242.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">MT</text>
<text x="90.0" y="242.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">memory type: 0 normal cached, 1 normal uncached, 2 device strongly ordered, 3 device weakly ordered</text>
<text x="24.0" y="264.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace" font-weight="bold">rsvd</text>
<text x="90.0" y="264.0" font-size="10" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">bits 10-11 and 40-63 must be zero; a set bit is a page fault (for a 40-bit physical address)</text>
<text x="20.0" y="292.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Bit positions are those of statement 6.7.1; bits 0 to 7 are in the same places as in RISC-V.</text>
</svg>
