<svg xmlns="http://www.w3.org/2000/svg" width="690" height="420" viewBox="0 0 690 420" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">a UEFI shim (4.9): a second stage that looks like firmware to a loader, and is virtio underneath</text>
<rect x="20.0" y="34.0" width="90.0" height="30.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="65.0" y="52.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot ROM</text>
<rect x="140.0" y="34.0" width="90.0" height="30.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="185.0" y="52.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">block 0</text>
<rect x="260.0" y="34.0" width="130.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="325.0" y="52.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the shim</text>
<rect x="420.0" y="34.0" width="130.0" height="30.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="485.0" y="52.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">loader.efi</text>
<rect x="580.0" y="34.0" width="90.0" height="30.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="625.0" y="52.9" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel</text>
<path d="M110.0,49.0 L140.0,49.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="140.0,49.0 132.0,52.6 132.0,45.4" fill="#222"/>
<path d="M230.0,49.0 L260.0,49.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="260.0,49.0 252.0,52.6 252.0,45.4" fill="#222"/>
<path d="M390.0,49.0 L420.0,49.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="420.0,49.0 412.0,52.6 412.0,45.4" fill="#222"/>
<path d="M550.0,49.0 L580.0,49.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="580.0,49.0 572.0,52.6 572.0,45.4" fill="#222"/>
<text x="325.0" y="80.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">second stage in the pdp64 chain</text>
<rect x="20.0" y="100.0" width="400.0" height="46.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="220.0" y="122.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the loader: an existing UEFI program</text>
<text x="220.0" y="134.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">built as a PE/COFF image for the pdp64 (4.9); OpenBSD efiboot is one</text>
<rect x="20.0" y="146.0" width="400.0" height="86.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="220.0" y="162.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the shim's services table: function pointers</text>
<text x="34.0" y="178.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">allocate and free pages; get the memory map</text>
<text x="34.0" y="189.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">read a file from the boot partition</text>
<text x="34.0" y="200.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">console in and out; graphics output (a framebuffer)</text>
<text x="34.0" y="211.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">exit boot services (stop using the services)</text>
<text x="34.0" y="222.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">runtime: the clock, reset</text>
<rect x="20.0" y="232.0" width="400.0" height="38.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="220.0" y="250.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the shim's own code</text>
<text x="220.0" y="262.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a PE loader, a heap, virtio-blk and FAT readers, a console</text>
<rect x="20.0" y="270.0" width="400.0" height="38.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="220.0" y="288.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">virtio devices (chapter 2): blk, gpu, console</text>
<text x="220.0" y="300.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">found by bus enumeration; drivers the second stage has anyway</text>
<rect x="450.0" y="100.0" width="220.0" height="46.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="560.0" y="122.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the loader calls the table</text>
<text x="560.0" y="134.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">through the pointers</text>
<path d="M420.0,123.0 L450.0,123.0" fill="none" stroke="#222" stroke-width="0.9" stroke-dasharray="5 3"/>
<polygon points="450.0,123.0 442.0,126.6 442.0,119.4" fill="#222"/>
<rect x="450.0" y="160.0" width="220.0" height="46.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="560.0" y="182.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">exit boot services</text>
<text x="560.0" y="194.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the loader now owns memory</text>
<rect x="450.0" y="220.0" width="220.0" height="88.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="560.0" y="236.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">hand-off to the kernel</text>
<text x="560.0" y="252.0" font-size="9" text-anchor="middle" fill="#222" font-family="DejaVu Sans, sans-serif">the boot-information block (4.6), or</text>
<text x="560.0" y="264.0" font-size="9" text-anchor="middle" fill="#222" font-family="DejaVu Sans, sans-serif">a device tree or tables made from it,</text>
<text x="560.0" y="276.0" font-size="9" text-anchor="middle" fill="#222" font-family="DejaVu Sans, sans-serif">and the memory map in the form</text>
<text x="560.0" y="288.0" font-size="9" text-anchor="middle" fill="#222" font-family="DejaVu Sans, sans-serif">the loader expects</text>
<text x="20.0" y="332.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The loader needs the services table, a PE/COFF image of its own and a machine-type number for the pdp64 that the owners of the UEFI</text>
<text x="20.0" y="345.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">specification would have to assign (unverified, 4.11).  The shim is a few services over drivers that already exist; it is not a firmware</text>
<text x="20.0" y="358.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">stack: no PEI, DXE or driver model, no variable store, no setup screen.  Nothing is built; this illustrates the size of the job (4.9).</text>
<text x="20.0" y="380.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The services named are those OpenBSD's efiboot loaders call (measured, 4.11): about fifteen boot and runtime services in each.</text>
<text x="20.0" y="393.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Which of them a given loader needs is for the person who writes the shim to find by reading that loader.</text>
</svg>
