<svg xmlns="http://www.w3.org/2000/svg" width="690" height="410" viewBox="0 0 690 410" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the 39-bit virtual space of three levels: one example arrangement</text>
<rect x="150.0" y="30.0" width="270.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="45.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">kernel stacks, per-CPU data</text>
<rect x="150.0" y="54.0" width="270.0" height="30.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="68.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">device windows (memory type: device)</text>
<text x="285.0" y="80.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">mapped by page entries, MT 2 or 3</text>
<rect x="150.0" y="84.0" width="270.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="98.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">direct-mapping windows DMW0, DMW1</text>
<text x="285.0" y="110.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">kernel only; format open (6.9.2)</text>
<rect x="150.0" y="114.0" width="270.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="130.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">kernel text and data</text>
<text x="285.0" y="142.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">global pages, in every address space</text>
<text x="142.0" y="40.0" font-size="8" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0xFFFFFFFFFFFFFFFF</text>
<text x="142.0" y="158.0" font-size="8" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0xFFFFFFC000000000</text>
<text x="430.0" y="80.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">upper half: bit 38 set</text>
<text x="430.0" y="94.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">walked from KTBR, in kernel mode only</text>
<text x="430.0" y="107.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">one table for the whole system</text>
<rect x="150.0" y="152.0" width="270.0" height="40.0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="285.0" y="171.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">not canonical: every address here faults</text>
<text x="285.0" y="183.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">bits 63-39 are not all equal to bit 38 (ECAUSE 5)</text>
<rect x="150.0" y="196.0" width="270.0" height="34.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="212.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">stack</text>
<text x="285.0" y="224.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">grows down</text>
<rect x="150.0" y="230.0" width="270.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="250.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">mapped files, shared libraries</text>
<rect x="150.0" y="264.0" width="270.0" height="26.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="276.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">heap</text>
<text x="285.0" y="288.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">grows up</text>
<rect x="150.0" y="290.0" width="270.0" height="24.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="305.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">data</text>
<rect x="150.0" y="314.0" width="270.0" height="24.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="329.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">text (code)</text>
<rect x="150.0" y="338.0" width="270.0" height="18.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="285.0" y="350.1" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">page 0: never mapped (null pointers fault)</text>
<text x="142.0" y="206.0" font-size="8" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0x0000003FFFFFFFFF</text>
<text x="142.0" y="362.0" font-size="8" text-anchor="end" fill="#555" font-family="DejaVu Sans Mono, monospace">0</text>
<text x="430.0" y="266.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">lower half: bit 38 clear</text>
<text x="430.0" y="280.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">walked from PTBR: one table per</text>
<text x="430.0" y="293.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">process, and the ASID selects it</text>
<text x="430.0" y="306.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">a user program never sees the upper half</text>
<text x="20.0" y="384.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The halves are decided; what goes in them is not specified.  Each half is 2^38 bytes = 256 GB with three levels, 128 TB with four, 64 PB with five.</text>
<text x="20.0" y="398.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The order, the sizes of the regions and the placement of the windows are the kernel's choice; nothing here is tested.</text>
</svg>
