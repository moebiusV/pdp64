<text x="236.0" y="168.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">padding</text>
<path d="M20.0,178.0 L260.0,178.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="260.0,178.0 252.0,181.6 252.0,174.4" fill="#222"/>
<text x="140.0" y="192.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">stride = bytes from the start of one row to the start of the next</text>
<text x="330.0" y="28.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the same bytes, as memory sees them</text>
<rect x="330.0" y="38.0" width="200.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="430.0" y="53.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">row 0: pixels 0 to 7</text>
<rect x="530.0" y="38.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="555.0" y="53.1" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">pad</text>
<text x="588.0" y="54.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">base + 0 x stride</text>
<rect x="330.0" y="68.0" width="200.0" height="24.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="430.0" y="83.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">row 1: pixels 0 to 7</text>
<rect x="530.0" y="68.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="555.0" y="83.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">pad</text>
<text x="588.0" y="84.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">base + 1 x stride</text>
<rect x="330.0" y="98.0" width="200.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="430.0" y="113.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">row 2: pixels 0 to 7</text>
<rect x="530.0" y="98.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="555.0" y="113.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">pad</text>
<text x="588.0" y="114.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">base + 2 x stride</text>
<rect x="330.0" y="128.0" width="200.0" height="24.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="430.0" y="143.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">row 3: pixels 0 to 7</text>
<rect x="530.0" y="128.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="555.0" y="143.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">pad</text>
<text x="588.0" y="144.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">base + 3 x stride</text>
<rect x="330.0" y="158.0" width="200.0" height="24.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="430.0" y="173.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">row 4: pixels 0 to 7</text>
<rect x="530.0" y="158.0" width="50.0" height="24.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="555.0" y="173.2" font-size="9" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">pad</text>
<text x="588.0" y="174.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans Mono, monospace">base + 4 x stride</text>
<text x="330.0" y="206.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">address of pixel (x, y) = base + y * stride + x * bytes_per_pixel</text>
<text x="330.0" y="222.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">e.g. 1920 x 1080, 4 bytes a pixel: stride 7680, 8,294,400 bytes</text>
<text x="330.0" y="238.0" font-size="10" text-anchor="start" fill="#333" font-family="DejaVu Sans, sans-serif">the display reads this from the top row down, ~60 times a second</text>
<text x="20.0" y="286.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Padding makes every row start on an aligned address; software must use the stride, not width x bytes.</text>
</svg>
