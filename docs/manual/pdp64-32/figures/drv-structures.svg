<svg xmlns="http://www.w3.org/2000/svg" width="690" height="400" viewBox="0 0 690 400" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the structure of a driver: the PDP-11 (V7, 2.11BSD) beside the pdp64</text>
<text x="20.0" y="38.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">PDP-11</text>
<text x="360.0" y="38.0" font-size="11" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">pdp64 (an illustration: no driver exists)</text>
<rect x="20.0" y="48.0" width="300.0" height="48.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="170.0" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">bdevsw[6]: rkopen, rkclose, rkstrategy, ...</text>
<text x="170.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the device switch: the major number picks the row</text>
<rect x="20.0" y="116.0" width="300.0" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="170.0" y="135.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">rkstrategy, rkstart</text>
<text x="170.0" y="147.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">queue the buf, load the registers</text>
<rect x="20.0" y="176.0" width="300.0" height="108.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="28.0" y="192.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">registers at 0177400 (set by switches):</text>
<text x="28.0" y="204.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">  RKDS  RKER  RKCS  RKWC  RKBA  RKDA</text>
<text x="28.0" y="216.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace"></text>
<text x="28.0" y="228.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans Mono, monospace">RKCS: GO 01, IDE 0100, RDY 0200, ERR 0100000</text>
<rect x="20.0" y="304.0" width="300.0" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="170.0" y="323.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">vector 0220: rkintr, priority 5</text>
<text x="170.0" y="335.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the device supplies it; BR5</text>
<path d="M170.0,96.0 L170.0,116.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="170.0,116.0 166.4,108.0 173.6,108.0" fill="#222"/>
<path d="M170.0,156.0 L170.0,176.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="170.0,176.0 166.4,168.0 173.6,168.0" fill="#222"/>
<path d="M170.0,284.0 L170.0,304.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="170.0,304.0 166.4,296.0 173.6,296.0" fill="#222"/>
<rect x="360.0" y="48.0" width="310.0" height="48.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="515.0" y="71.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">match, attach, strategy, intr (OpenBSD cfattach)</text>
<text x="515.0" y="83.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">found by vendor and device ID: 0x1AF4, 0x1040 + type</text>
<rect x="360.0" y="116.0" width="310.0" height="40.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="515.0" y="135.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">transport + class driver</text>
<text x="515.0" y="147.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">handshake, queues, requests</text>
<rect x="360.0" y="176.0" width="150.0" height="108.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="366.0" y="192.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">a PCI Express function</text>
<text x="366.0" y="204.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">common configuration:</text>
<text x="366.0" y="216.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> device_status 0x14</text>
<text x="366.0" y="228.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> queue_select 0x16</text>
<text x="366.0" y="240.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> queue_desc 0x20 ...</text>
<text x="366.0" y="252.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">ordinary loads, stores</text>
<rect x="530.0" y="176.0" width="140.0" height="108.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="536.0" y="192.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">queues in memory:</text>
<text x="536.0" y="204.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> descriptor table</text>
<text x="536.0" y="216.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> available ring</text>
<text x="536.0" y="228.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"> used ring</text>
<text x="536.0" y="240.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">(uncached, 5.10)</text>
<path d="M510.0,230.0 L530.0,230.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="530.0,230.0 522.0,233.6 522.0,226.4" fill="#222"/>
<rect x="360.0" y="304.0" width="310.0" height="40.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="515.0" y="323.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">MSI-X entry: address, data, per queue</text>
<text x="515.0" y="335.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a write; the vector number is the controller's (open, R1)</text>
<path d="M515.0,96.0 L515.0,116.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="515.0,116.0 511.4,108.0 518.6,108.0" fill="#222"/>
<path d="M515.0,156.0 L515.0,176.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="515.0,176.0 511.4,168.0 518.6,168.0" fill="#222"/>
<path d="M515.0,284.0 L515.0,304.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<polygon points="515.0,304.0 511.4,296.0 518.6,296.0" fill="#222"/>
<text x="20.0" y="370.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">What a driver was told on the PDP-11 (the address, the vector, the level) it asks or reads on the pdp64; what it knew (the register bits) it negotiates.</text>
<text x="20.0" y="384.0" font-size="8" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">Sources: V7 rk.c, 2.11BSD rkreg.h, pdp/conf.c, pdp/scb.s (read); virtio_pci.h, OpenBSD vioblk.c (read); chapter 2.</text>
</svg>
