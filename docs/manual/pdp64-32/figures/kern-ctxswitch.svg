<svg xmlns="http://www.w3.org/2000/svg" width="690" height="380" viewBox="0 0 690 380" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">switching from process A to process B, in the kernel, at priority 7</text>
<rect x="20.0" y="34.0" width="150.0" height="60.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">A: kernel stack</text>
<text x="95.0" y="75.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">callee-saved registers, saved</text>
<rect x="20.0" y="100.0" width="150.0" height="40.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="119.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">A: trap frame</text>
<text x="95.0" y="131.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">EPC, EPSW (PUSHX), registers</text>
<rect x="520.0" y="34.0" width="150.0" height="60.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="595.0" y="63.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">B: kernel stack</text>
<text x="595.0" y="75.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">callee-saved registers, to load</text>
<rect x="520.0" y="100.0" width="150.0" height="40.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="595.0" y="119.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">B: trap frame</text>
<text x="595.0" y="131.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">EPC, EPSW, registers</text>
<rect x="190.0" y="34.0" width="310.0" height="106.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="198.0" y="50.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">1  push callee-saved registers on A's stack</text>
<text x="198.0" y="63.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">    A.ksp = R14</text>
<text x="198.0" y="76.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">2  R14 = B.ksp; pop B's callee-saved registers</text>
<text x="198.0" y="89.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">3  if B has another address space:</text>
<text x="198.0" y="102.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">       MTSR PTBR, B.root     MTASID B.asid</text>
<text x="198.0" y="115.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">       ISYNC     (the new base takes effect)</text>
<text x="198.0" y="128.0" font-size="9" text-anchor="start" fill="#111" font-family="DejaVu Sans Mono, monospace">4  return (into B, in the kernel)</text>
<text x="20.0" y="170.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">then, on the way out to user mode in B</text>
<rect x="20.0" y="180.0" width="150.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="95.0" y="194.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">MTSR USP, B.usp</text>
<text x="95.0" y="206.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">the user stack pointer</text>
<rect x="200.0" y="180.0" width="150.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="275.0" y="194.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">POPX</text>
<text x="275.0" y="206.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">EPC, EPSW from B's frame</text>
<rect x="380.0" y="180.0" width="130.0" height="30.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="445.0" y="194.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">RTI</text>
<text x="445.0" y="206.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">PC, PSW from EPC, EPSW</text>
<path d="M170.0,195.0 L200.0,195.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="200.0,195.0 192.0,198.6 192.0,191.4" fill="#222"/>
<path d="M350.0,195.0 L380.0,195.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="380.0,195.0 372.0,198.6 372.0,191.4" fill="#222"/>
<text x="530.0" y="190.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">B runs, in user mode</text>
<rect x="20.0" y="236.0" width="330.0" height="44.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="185.0" y="257.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">translation buffer: nothing flushed</text>
<text x="185.0" y="269.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">entries of ASID A and B sit side by side</text>
<rect x="380.0" y="236.0" width="290.0" height="44.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="525.0" y="257.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the kernel's own pages: global, no ASID</text>
<text x="525.0" y="269.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">they answer in every address space</text>
<rect x="20.0" y="300.0" width="650.0" height="60.0" fill="#fff" stroke="#222" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="30.0" y="318.0" font-size="10" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">On the PDP-11 the same switch (resume, then sureg) loaded the new page registers:</text>
<text x="30.0" y="334.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">for each of 8 pairs (16 with separate instruction and data space): write PAR, write PDR:</text>
<text x="30.0" y="348.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">16 (or 32) register writes; the old map was overwritten, and there was no cache of it to flush.</text>
</svg>
