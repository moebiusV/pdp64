<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="16.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the boot stages: each is small, knows one more thing than the one before, and hands on a little</text>
<rect x="20.0" y="36.0" width="140.0" height="44.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="90.0" y="57.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">boot ROM</text>
<text x="90.0" y="69.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">in the controller chip</text>
<rect x="20.0" y="80.0" width="140.0" height="116.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="28.0" y="98.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">knows: a boot device,</text>
<text x="28.0" y="110.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">how to read one block</text>
<text x="28.0" y="122.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">from a virtio-blk disk</text>
<text x="28.0" y="134.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"></text>
<text x="28.0" y="146.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">does not know: partitions,</text>
<text x="28.0" y="158.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">files, a label, a kernel</text>
<path d="M160.0,58.0 L192.0,58.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="192.0,58.0 184.0,61.6 184.0,54.4" fill="#222"/>
<rect x="192.0" y="36.0" width="140.0" height="44.0" fill="#f7e3dc" stroke="#222" stroke-width="1.2"/>
<text x="262.0" y="57.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">block 0</text>
<text x="262.0" y="69.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">first stage: one block</text>
<rect x="192.0" y="80.0" width="140.0" height="116.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="200.0" y="98.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">knows: where the second</text>
<text x="200.0" y="110.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">stage lies on the disk</text>
<text x="200.0" y="122.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">and how to read it</text>
<text x="200.0" y="134.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"></text>
<text x="200.0" y="146.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">does not know: a file</text>
<text x="200.0" y="158.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">system, a kernel</text>
<path d="M332.0,58.0 L364.0,58.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="364.0,58.0 356.0,61.6 356.0,54.4" fill="#222"/>
<rect x="364.0" y="36.0" width="140.0" height="44.0" fill="#fbf2cf" stroke="#222" stroke-width="1.2"/>
<text x="434.0" y="57.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">second stage</text>
<text x="434.0" y="69.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">a C program, any size</text>
<rect x="364.0" y="80.0" width="140.0" height="116.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="372.0" y="98.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">knows: the disk, the file</text>
<text x="372.0" y="110.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">system, how to find the</text>
<text x="372.0" y="122.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">kernel by name</text>
<text x="372.0" y="134.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"></text>
<text x="372.0" y="146.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">is an ordinary program</text>
<path d="M504.0,58.0 L536.0,58.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="536.0,58.0 528.0,61.6 528.0,54.4" fill="#222"/>
<rect x="536.0" y="36.0" width="140.0" height="44.0" fill="#e1f0dd" stroke="#222" stroke-width="1.2"/>
<text x="606.0" y="57.0" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">kernel</text>
<text x="606.0" y="69.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">/bsd, an ELF file</text>
<rect x="536.0" y="80.0" width="140.0" height="116.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="544.0" y="98.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">knows: everything else:</text>
<text x="544.0" y="110.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">enumerates the bus,</text>
<text x="544.0" y="122.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">attaches the drivers</text>
<text x="544.0" y="134.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif"></text>
<text x="544.0" y="146.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">owns the machine</text>
<path d="M176.0,200.0 L176.0,214.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="176.0" y="226.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">block 0 is read into</text>
<text x="176.0" y="238.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">low memory; core 0</text>
<text x="176.0" y="250.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">starts at it</text>
<path d="M348.0,200.0 L348.0,214.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="348.0" y="226.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">the first stage loads</text>
<text x="348.0" y="238.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">the second stage</text>
<text x="348.0" y="250.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif"></text>
<path d="M520.0,200.0 L520.0,214.0" fill="none" stroke="#222" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="520.0" y="226.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">the kernel gets a</text>
<text x="520.0" y="238.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">boot-information</text>
<text x="520.0" y="250.0" font-size="9" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">block</text>
<text x="20.0" y="284.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">Stage sizes are the reason for the stages: the ROM and the first block are the smallest code that can be made to find the next,</text>
<text x="20.0" y="297.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">and only the second stage is big enough to read a file system.</text>
<text x="20.0" y="316.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The kernel is OpenBSD (errata 41 and 47).</text>
</svg>
