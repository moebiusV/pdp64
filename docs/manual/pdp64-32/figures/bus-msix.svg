<svg xmlns="http://www.w3.org/2000/svg" width="690" height="350" viewBox="0 0 690 350" font-family="DejaVu Sans, sans-serif">
<text x="20.0" y="18.0" font-size="12" text-anchor="start" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">MSI-X: an interrupt is a table entry the device turns into one memory write</text>
<text x="120.0" y="44.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">MSI-X capability (in config space)</text>
<rect x="20.0" y="52.0" width="200.0" height="40.0" fill="#fbe9c8" stroke="#222" stroke-width="1.2"/>
<text x="120.0" y="75.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">id 0x11 | next</text>
<rect x="20.0" y="92.0" width="200.0" height="40.0" fill="#fbe9c8" stroke="#222" stroke-width="1.2"/>
<text x="120.0" y="111.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">Message control</text>
<text x="120.0" y="123.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">enable | mask all | table size - 1</text>
<rect x="20.0" y="132.0" width="200.0" height="40.0" fill="#fbe9c8" stroke="#222" stroke-width="1.2"/>
<text x="120.0" y="151.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">Table offset | BIR</text>
<text x="120.0" y="163.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">which BAR, where in it</text>
<rect x="20.0" y="172.0" width="200.0" height="40.0" fill="#fbe9c8" stroke="#222" stroke-width="1.2"/>
<text x="120.0" y="191.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">PBA offset | BIR</text>
<text x="120.0" y="203.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">pending bits: same idea</text>
<text x="350.0" y="44.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">the table (in a BAR)</text>
<rect x="275.0" y="52.0" width="150.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="350.0" y="72.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">entry 0</text>
<rect x="275.0" y="86.0" width="150.0" height="34.0" fill="#dce9f7" stroke="#222" stroke-width="1.2"/>
<text x="350.0" y="106.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">entry 1</text>
<rect x="275.0" y="120.0" width="150.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="350.0" y="140.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">entry 2</text>
<rect x="275.0" y="154.0" width="150.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="350.0" y="174.8" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">entry N-1</text>
<path d="M220.0,152.0 L253.0,152.0 L253.0,66.0 L275.0,66.0" fill="none" stroke="#222" stroke-width="1.4"/>
<polygon points="275.0,66.0 267.0,69.6 267.0,62.4" fill="#222"/>
<text x="570.0" y="44.0" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif" font-weight="bold">one entry, 16 bytes</text>
<rect x="475.0" y="52.0" width="34.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="492.0" y="72.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0x0</text>
<rect x="509.0" y="52.0" width="156.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="587.0" y="72.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">Message address, low 32 bits</text>
<rect x="475.0" y="86.0" width="34.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="492.0" y="106.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0x4</text>
<rect x="509.0" y="86.0" width="156.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="587.0" y="106.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">Message address, high 32 bits</text>
<rect x="475.0" y="120.0" width="34.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="492.0" y="140.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0x8</text>
<rect x="509.0" y="120.0" width="156.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="587.0" y="140.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">Message data, 32 bits</text>
<rect x="475.0" y="154.0" width="34.0" height="34.0" fill="#e6e6e6" stroke="#222" stroke-width="1.2"/>
<text x="492.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">0xC</text>
<rect x="509.0" y="154.0" width="156.0" height="34.0" fill="#f4f4f4" stroke="#222" stroke-width="1.2"/>
<text x="587.0" y="174.5" font-size="10" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">Vector control: bit 0 = masked</text>
<path d="M425.0,103.0 L461.0,103.0 L461.0,69.0 L475.0,69.0" fill="none" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="345.0" y="232.0" font-size="11" text-anchor="middle" fill="#111" font-family="DejaVu Sans, sans-serif">When the device has something to report on vector 1 and the entry is not masked, it performs</text>
<rect x="80.0" y="244.0" width="530.0" height="34.0" fill="#fff" stroke="#222" stroke-width="1.2"/>
<text x="345.0" y="265.2" font-size="12" text-anchor="middle" fill="#111" font-family="DejaVu Sans Mono, monospace">memory write:  address = (high, low)   data = Message data</text>
<text x="345.0" y="300.0" font-size="10" text-anchor="middle" fill="#333" font-family="DejaVu Sans, sans-serif">The address is a location the interrupt controller watches; no wire, no vector number from the card, no BR level.</text>
<text x="345.0" y="316.0" font-size="10" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">If the entry is masked the device sets the vector's bit in the pending-bit array and sends nothing until it is unmasked.</text>
<text x="345.0" y="332.0" font-size="9" text-anchor="middle" fill="#555" font-family="DejaVu Sans, sans-serif">Offsets and bit positions as in pci_regs.h (PCI_MSIX_*). The entry numbers are examples.</text>
</svg>
