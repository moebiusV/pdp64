<text x="504.0" y="283.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the screen</text>
<path d="M492.0,302.0 L498.0,302.0 L498.0,318.0 L492.0,318.0" fill="none" stroke="#222" stroke-width="1"/>
<text x="504.0" y="313.0" font-size="9" text-anchor="start" fill="#222" font-family="DejaVu Sans, sans-serif">the human</text>
<text x="20.0" y="340.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">Each row is one 64-bit word in this drawing (the offsets are bytes).  The contents are statements 4.6.2 and 4.6.4;</text>
<text x="20.0" y="353.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">the offsets, the widths and the order drawn are an example, not specified.</text>
<text x="20.0" y="370.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">Defined once in a grammar from which the headers are generated, so the loader and the kernel cannot disagree (4.6.3).</text>
<text x="20.0" y="383.0" font-size="9" text-anchor="start" fill="#444" font-family="DejaVu Sans, sans-serif">The devices are found by enumerating the bus (2.4), so the block stays short.</text>
<text x="20.0" y="398.0" font-size="9" text-anchor="start" fill="#555" font-family="DejaVu Sans, sans-serif">The VAX and Alpha passed similar blocks, a restart parameter block each (from the boot review, unverified, 4.11).</text>
</svg>
