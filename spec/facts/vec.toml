op = "vD[i] <- (vA[i] + vB[i] + 1) >> 1"
notes = "Lanes `b` and `w`; the sum is made in a wider type, so it cannot wrap, and rounds up (half toward plus infinity); `VAVG` signed, `VAVGU` unsigned. One word for the add, the add of one and the shift of the weighted prediction of video codecs (errata 170)."

