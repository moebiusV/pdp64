op = "vD[i] <- vA[i] - vB[i]; VSUBR: vD[i] <- operand - vA[i]"
notes = "`VSUBR` is the reverse subtract: `vsubr.w v2, v2, #255` is `255 - v2`. `VSUBS`, `VSUBSU` saturate."

