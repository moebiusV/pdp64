[vbsl]
wave = "wave 2"
meaning = "bitwise select `(vM & vA) \\| (~vM & vB)`"
llvm = true
exec = "VO_BSL"
asm = "bsl"
entry = "VBSL"
entry_seq = 12
title = "Bitwise select"
syntax = ["VBSL vD, vM, vA, vB"]
op = "vD <- (vM & vA) | (~vM & vB), bit by bit"
notes = "No lane suffix: it selects bits. With a lane mask of `VCEQ`, `VCGT` or `VCGTU` in `vM` it is the select of a ternary operator. `vD` may be `vM`, `vA` or `vB` (all are read first). The assembler checks that the mask and both operands hold lanes of the same size (errata 171)."

[vcvt]
wave = "wave 2"
meaning = "int32 <-> binary32 conversion (`vcvt.<from>.<to>`)"
llvm = true
exec = "VO_CVT"
asm = "cvt"
entry = "VCVT"
entry_seq = 13
title = "Convert 32-bit lanes between integer and binary32"
syntax = ["VCVT.l.f, VCVT.lu.f vD, vA  (int32 to binary32)", "VCVT.f.l, VCVT.f.lu vD, vA  (binary32 to int32)"]
op = "int to float: vD[i] <- (float) vA[i], round to nearest even;  float to int: truncate toward zero, saturate, a NaN gives the largest value"
notes = "The name is `VCVT.<from>.<to>`, `l` signed and `lu` unsigned 32-bit integer lanes. The rules are those of the scalar `FCVTLS` and `FCVTSL`: float to signed integer truncates and saturates (a NaN gives 2147483647); to unsigned a negative value gives 0 and a NaN or a value of 2^32 or more gives 4294967295 (as `FCVTDQU`). 2^24 + 1 rounds to 2^24. No flag is set in `FPSR` (the vector lanes never touch it). The lanes change type: the assembler checks it (errata 171)."

[vacc]
wave = "original"
meaning = "`Rd +=` the sum of the lanes, `vacc.<src>.<acc>` (the form: errata 168); floating point in the canonical order (errata 174)"
llvm = true
exec = "VO_ACC"
asm = "acc"
asm_fsum = true
entry = "VACC"
entry_seq = 22
title = "Reduce a vector into a register"
syntax = ["VACC.src.acc Rd, vS", "VMAXACC.src Rd, vS", "VMINACC.src Rd, vS"]
op = "Rd <- Rd + the sum of the lanes, made in the width acc | max(Rd, the largest lane) | min(Rd, the smallest lane)"
notes = "The source type `src` is the lane type the register holds, with its signedness (`b w l q` signed, `bu wu lu` unsigned, `f d`): the lanes are extended as it says, so unsigned bytes sum without a widening load. The sum is made in `acc` and wraps there: `l` for byte and halfword sources, `l` or `q` for 32-bit lanes, `q` for 64-bit lanes, `f` or `d` for floating point (the fewest widths, to keep the adder tree small). The strip's `VL` counts the source lanes, not `acc`. The assembler refuses a `src` that is not the lane type the last instruction of the block wrote into the register (errata 168). The register is updated when the strip commits. **A floating-point sum (`VACC.f`, `VACC.f.d`, `VACC.d`) is in a canonical order that does not depend on the strip** (errata 174): the lanes of the stream are taken in chunks of 16 bytes of source lanes (4 binary32, 2 binary64), each chunk is summed by the fixed tree ((l0 + l1) + (l2 + l3)) in the width `acc`, and the chunks are added to the register one after the other in element order; a short last chunk has the lanes it has. The assembler refuses the sum in a block with a lane wider than its source lane. `VMAXACC` and `VMINACC` take the lanes in element order."

[vmaxacc]
wave = "original"
meaning = "`Rd = max(Rd, the largest lane)`"
llvm = true
exec = "VO_MAXACC"
asm = "acc"
entry = "VACC"

[vminacc]
wave = "original"
meaning = "`Rd = min(Rd, the smallest lane)`"
llvm = true
exec = "VO_MINACC"
asm = "acc"
entry = "VACC"

[vfir]
wave = "original"
meaning = "sliding-window multiply-accumulate over `taps` scalar registers"
llvm = true
exec = "VO_FIR"
asm = "same"
entry = "VFIR"
entry_seq = 23
title = "Sliding-window multiply-accumulate"
syntax = ["VFIR.t vD, vS, Rt, #taps"]
op = "lane i of vD <- the sum over k = 0..taps-1 of R(t+k) x lane (i+k-c) of vS;  c = taps/2 rounded down"
notes = "The neighbours across the edge of the strip are the last and first elements of the previous and next strip, so the region is read once; it reads `c` elements before the region and `taps-1-c` after, as the scalar code does."

[vclr]
wave = "original"
meaning = "zero `count` registers and name them accumulators (16-byte strip)"
llvm = true
exec = "VO_CLR"
asm = "clr"
asm_no2d = true
entry = "VCLR"
entry_seq = 24
title = "Zero and name accumulators"
syntax = ["VCLR.t vN, #count"]
op = "vN .. v(N+count-1) <- 0, and they keep their values from one strip to the next within the block"
notes = "The accumulators are the only hidden state that survives a strip (`vec-isa.md` 4.1). A block that names accumulators has a strip of exactly 16 bytes on every implementation, so the lanes of an accumulator are the program's (errata 173); they are read out after the last strip by `VFIN`."
