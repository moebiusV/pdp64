[vfma]
wave = "original"
meaning = "floating-point `vD += vA * x`"
llvm = true
exec = "VO_FMA"
asm = "bin"
entry = "VFMA"
entry_seq = 18
title = "Floating-point multiply-add"
syntax = ["VFMA.f vD, vA, vB | Rs", "VFNMA.f vD, vA, vB", "VFMAB.f vD, vA, (Ra)+"]
op = "vD[i] <- vD[i] + vA[i] x vB[i];  VFNMA: vD - vA x vB;  VFMAB: vD + vA x broadcast(*Ra), Ra moved by one element"
notes = "`VFMAB` is the broadcast multiply-add of the GEMM micro-kernel (the ten registers of the micro-kernel are why there are sixteen vector registers). A block with `VFMAB` has a strip of 16 bytes on every implementation (a strip is one step of the micro-kernel and the pointer `Ra` moves once for each strip: errata 173). Floating-point lanes follow the scalar rules (IEEE 754, flags accumulated in `FPSR`, no traps)."
