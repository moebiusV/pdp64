# The facts about the base mnemonics of the vec block family (errata 183).
#
# The grammar (spec/grammars.d/) is the source of truth for the names, the encodings and the operand shapes. This file holds what a grammar cannot:
# one table for each base mnemonic, which is the key (the part of a word before the first dot: vdacc for vdacc.b, vdacc.bu ...). tools/facts.py reads it;
# `tools/facts.py --check` fails when the grammar has a base mnemonic of the family with no table here, or a table here names a base the grammar no longer has.
#
# Fields: wave    where the base came from (the label of the "family at a glance" table of docs/encoding-work/vec-isa.md)
#         meaning one line, markdown
#         llvm    true when the LLVM back end's name tables carry the words of the base (tools/gen-llvm-td.py)
#
# The order of the tables is the order of the groups in vec-isa.md section 2 and of the table that tools/vec-glance.py writes.

[vec]
wave = "original"
meaning = "begin a block over the region `[Rs, Re)`"
llvm = true

[vec2]
wave = "errata 176"
meaning = "begin a 2D block: `Rn` rows of the region `[Rs, Re)`, the streams advanced by a pitch at the end of each row (`vec2 Rs, Re, Rn, Rw`)"
llvm = true

[vskip]
wave = "errata 176"
meaning = "after `vec2`: at the end of each row, add the gap register `Rg` to the pointer `Ra` (`vskip Ra, Rg`: the pitch minus the bytes the row used)"
llvm = true

[vend]
wave = "original"
meaning = "end a block"
llvm = true

[vfin]
wave = "errata 173"
meaning = "split a block: what follows runs once after the last strip (the epilogue), on the final accumulators"
llvm = true

[vld]
wave = "original"
meaning = "load a strip, widening on the way in (`vld.<m>[.<lane>]`)"
llvm = true

[vst]
wave = "original"
meaning = "store a strip, truncating on the way out (`vst.<lane>[.<m>]`)"
llvm = true

[vsts]
wave = "original"
meaning = "narrowing store with clamping; with `#sh` a rounding shift first (the `#sh` form: wave 1)"
llvm = true

[vldt]
wave = "original"
meaning = "strided load (one field of an array of structures)"
llvm = true

[vstt]
wave = "original"
meaning = "strided store"
llvm = true

[vlseg2]
wave = "original"
meaning = "load 2 interleaved fields into `vD`, `vD+1`"
llvm = true

[vlseg3]
wave = "original"
meaning = "load 3 interleaved fields"
llvm = true

[vlseg4]
wave = "original"
meaning = "load 4 interleaved fields"
llvm = true

[vsseg2]
wave = "original"
meaning = "store 2 registers interleaved"
llvm = true

[vsseg3]
wave = "original"
meaning = "store 3 registers interleaved"
llvm = true

[vsseg4]
wave = "original"
meaning = "store 4 registers interleaved"
llvm = true

[vadd]
