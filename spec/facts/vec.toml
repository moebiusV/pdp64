# The facts about the base mnemonics of the vec block family (errata 183).
#
# The grammar (spec/grammars.d/) is the source of truth for the names, the encodings and the operand shapes. This file holds what a grammar cannot:
# one table for each base mnemonic, which is the key (the part of a word before the first dot: vdacc for vdacc.b, vdacc.bu ...). tools/facts.py reads it;
# `tools/facts.py --check` fails when the grammar has a base mnemonic of the family with no table here, or a table here names a base the grammar no longer has.
#
# Fields: wave    where the base came from (the label of the "family at a glance" table of docs/encoding-work/vec-isa.md)
#         meaning one line, markdown
#         llvm    true when the LLVM back end's name tables carry the words of the base (tools/gen-llvm-td.py)
#         exec    the executor's operation (VO_xxx of common/pdp64exec_vec.inc) that the base is decoded to: the name table is generated from it (tools/gen-vec-names.py)
#         asm     the class of the assembler's lane-type check (as64/as64.c vec_typecheck, the table as64/asmvecclass.inc): block (vec, vend), block2 (vec2), skip, fin,
#                 ld, st, dot, dacc, cmp, cvt, bsl, tbl, acc, clr, same (the register read and written as the lane of its suffix), bin (the same with two sources)
#         asm_no2d    true: a 2D block (vec2) refuses the word (accumulators and the epilogue)
#         asm_fsum    true: a floating-point sum of this base is the one whose order the block's widest lane must keep (errata 173)
#         entry   the id of the manual's dictionary entry the base belongs to (tools/manual/isa_vec.py); several bases may share one
#         entry_seq, title, syntax, op, notes, exc, cf   the text of that entry and its position in the chapter, on the first base of the entry only
#                 (exc and cf only where they are not the defaults of isa_vec.py)
#
# The order of the tables is the order of the groups in vec-isa.md section 2 and of the table that tools/vec-glance.py writes.

[vec]
wave = "original"
meaning = "begin a block over the region `[Rs, Re)`"
llvm = true
exec = "VO_VEC"
asm = "block"
entry = "VEC"
entry_seq = 0
title = "Begin a vector block"
syntax = ["VEC Rs, Re"]
op = "the instructions up to VEND run once for each strip of the region [Rs, Re) of the pointer register Rs, until it is exhausted"
notes = "The block: the instructions between `VEC` and `VEND` run for each **strip** of the first stream, `VL` elements, `1 <= VL <= the elements left`, chosen by the implementation for each strip. The program never names the width and the hardware never tells it: there is no instruction that gives `VL` (errata 173), the least strip is 16 bytes, and everything a block computes is the same on every implementation (`vec-isa.md` section 8). A block of one instruction without `VEND` is the one-instruction prefix (R430). Hidden vector registers `v0` to `v15` are not ordinary registers: the scalar instructions cannot read or write them and a context switch does not save them (R435); their contents do not survive from one strip to the next except for the accumulators that `VCLR` names. A block that holds accumulators has a strip of exactly 16 bytes on every implementation and restarts from its entry after a fault (`vec-isa.md` 4.1 and 8)."

[vec2]
wave = "errata 176"
meaning = "begin a 2D block: `Rn` rows of the region `[Rs, Re)`, the streams advanced by a pitch at the end of each row (`vec2 Rs, Re, Rn, Rw`)"
llvm = true
exec = "VO_VEC2"
asm = "block2"
entry = "VEC2"
entry_seq = 1
title = "Begin a 2D (tile) vector block"
syntax = ["VEC2 Rs, Re, Rn, Rw"]
op = "repeat the block Rn times: each row is the region [Rs, Re) of the pointer register Rs; at the end of a row Re moves by Rw plus the gap of Rs, Rn falls by one and every stream named by a VSKIP moves by its gap register"
notes = "The 2D block (errata 176, `docs/encoding-work/vec-2d.md`): the body is set up once and runs for each strip of each row; strips do not span rows, the last strip of a row is short. `Rw` is the bytes of a row of the first stream, constant; `Re` and `Rn` are ordinary registers that the block advances, so they are the progress: a fault in a strip annuls the strip, the registers are those at its start (the row advance is committed with the last strip of its row), and the same `VEC2` executed again continues at that strip of that row. The four registers must be different; a block with accumulators (`VCLR`, `VFMAB`, `VFIN`) is not a 2D block; a reduction register accumulates over the whole tile. A stream with no `VSKIP` is contiguous. Nested blocks are refused. The compiler does not emit it."
exc = "Memory operand: page fault, protection fault, alignment fault or bus error; precise at the strip: the strip is annulled, the pointers are those at its start, `EPC` is the address of the faulting instruction of the block."

[vskip]
wave = "errata 176"
meaning = "after `vec2`: at the end of each row, add the gap register `Rg` to the pointer `Ra` (`vskip Ra, Rg`: the pitch minus the bytes the row used)"
llvm = true
exec = "VO_SKIP"
asm = "skip"
entry = "VSKIP"
entry_seq = 2
title = "Row advance of one stream of a 2D block"
syntax = ["VSKIP Ra, Rg"]
op = "at the end of each row of the block begun by VEC2: Ra <- Ra + Rg"
notes = "Directly after `VEC2`, at most four, each pointer once. `Rg` is the gap: the pitch of the stream minus the bytes its row used (the pitch in bytes minus the row width in bytes of that stream, which differs between streams of different element sizes). `Rg` and `Rw` are read only in the block and may be shared by streams; `Ra` is not `Re`, `Rn` or `Rw`."

[vend]
wave = "original"
meaning = "end a block"
llvm = true
exec = "VO_VEND"
asm = "block"
entry = "VEND"
entry_seq = 3
title = "End a vector block"
syntax = ["VEND"]
op = "end of the block begun by VEC"
notes = "Nested blocks are refused."

[vfin]
wave = "errata 173"
meaning = "split a block: what follows runs once after the last strip (the epilogue), on the final accumulators"
llvm = true
exec = "VO_FIN"
asm = "fin"
asm_no2d = true
entry = "VFIN"
entry_seq = 4
title = "End of the strips of a block with accumulators"
syntax = ["VFIN"]
op = "the instructions after VFIN run once, after the last strip, on the final lanes of the accumulators"
notes = "The only strip-independent way to read an accumulator out (errata 173): the instructions between `VFIN` and `VEND` form the epilogue, one more strip of the block's lanes that runs once after the last strip, so a `VACC` of an accumulator or a store of it happens once, on its final value, whatever the implementation's strip. A block with `VFIN` is a block with accumulators: its strip is 16 bytes and a fault restarts it from its entry. A fault in the epilogue restarts the whole block."
exc = "Memory operand: page fault, protection fault, alignment fault or bus error; precise at the strip: the strip is annulled, the pointers are those at its start, `EPC` is the address of the faulting instruction of the block."

[vld]
wave = "original"
meaning = "load a strip, widening on the way in (`vld.<m>[.<lane>]`)"
llvm = true
exec = "VO_LD"
asm = "ld"
entry = "VLD"
entry_seq = 25
title = "Load a strip"
syntax = ["VLD.m[.lane] vD, (Ra)+ | d(Ra)"]
op = "vD <- the next strip from memory, widened to the lane"
notes = "`m` is the memory type (`b w l q`, a following `u` zero-extends, `f` and `d` floating point) and the optional second suffix the lane the strip is held in. `(Ra)+` moves the pointer past the strip. The `d(Ra)+` form (an offset and the move) is `d(Ra)` followed by an add."
exc = "Memory operand: page fault, protection fault, alignment fault or bus error; precise at the strip: the strip is annulled, the pointers are those at its start, `EPC` is the address of the faulting instruction of the block."

[vst]
wave = "original"
meaning = "store a strip, truncating on the way out (`vst.<lane>[.<m>]`)"
llvm = true
exec = "VO_ST"
asm = "st"
entry = "VST"
entry_seq = 26
title = "Store a strip"
syntax = ["VST.lane[.m] vS, (Ra)+ | d(Ra)", "VSTS.lane.m vS, (Ra)+ | d(Ra)", "VSTS.lane.m vS, (Ra)+, #sh"]
op = "the strip to memory, narrowed (truncating; VSTS: clamping to the range of m, after the rounding shift if there is one)"
notes = "`VSTS.l.bu` clamps to 0..255. With `#sh` (0 to 63) each lane is first shifted right by `sh` with rounding, (x + 2^(sh-1)) >> sh, exact and arithmetic, then clamped: the shift-round-narrow-saturate-store of `sqrshrun`."
exc = "Memory operand: page fault, protection fault, alignment fault or bus error; precise at the strip: the strip is annulled, the pointers are those at its start, `EPC` is the address of the faulting instruction of the block."

[vsts]
wave = "original"
meaning = "narrowing store with clamping; with `#sh` a rounding shift first (the `#sh` form: wave 1)"
llvm = true
exec = "VO_STS"
asm = "st"
entry = "VST"

[vldt]
wave = "original"
meaning = "strided load (one field of an array of structures)"
llvm = true
exec = "VO_LDT"
asm = "ld"
entry = "VLDT"
entry_seq = 27
title = "Strided load and store"
syntax = ["VLDT.m[.lane] vD, (Ra)+, #stride", "VSTT.lane[.m] vS, (Ra)+, #stride"]
op = "every `stride` bytes (one field of an array of structures)"
notes = "The stride is a 12-bit unsigned byte count; `(Ra)+` moves the pointer by the elements of the strip times the stride."
exc = "Memory operand: page fault, protection fault, alignment fault or bus error; precise at the strip: the strip is annulled, the pointers are those at its start, `EPC` is the address of the faulting instruction of the block."

