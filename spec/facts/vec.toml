[vadd]
wave = "original"
meaning = "lane add (wrapping)"
llvm = true
exec = "VO_ADD"
asm = "bin"
entry = "VADD"
entry_seq = 5
title = "Lane add"
syntax = ["VADD.t vD, vA, vB | Rs | #imm", "VADDS.t, VADDSU.t (saturating)"]
op = "vD[i] <- vA[i] + vB[i]  (a scalar register or an immediate is the same value in every lane)"
notes = "Lane arithmetic wraps unless the mnemonic says saturating (`VADDS` signed, `VADDSU` unsigned). Floating-point lanes follow the scalar rules (IEEE 754, flags accumulated in `FPSR`, no traps)."

