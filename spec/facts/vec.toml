[vtbl]
wave = "wave 1"
meaning = "byte lookup in a 16-byte table in memory; 0 for an index of 16 or more (memory form only)"
llvm = true
exec = "VO_TBL"
asm = "tbl"
entry = "VTBL"
entry_seq = 21
title = "Table lookup of bytes"
syntax = ["VTBL.b vD, (Ra), vI"]
op = "vD[i] <- the byte of a 16-byte table that the index lane vI[i] names; 0 if vI[i] >= 16 (unsigned)"
notes = "The table is exactly 16 bytes at `(Ra)`, the same for every lane and every strip, whatever the length of the strip. Nothing is kept between strips. It replaces the gather for the dequantisation tables (errata 170). There is no register form (errata 173): a table taken from the lanes of a register would be truncated by a short strip, so the strip would be visible."

[vceq]
wave = "wave 2"
meaning = "lane compare equal: a mask (all ones or zero)"
llvm = true
exec = "VO_CEQ"
asm = "cmp"
entry = "VCMP"
entry_seq = 11
title = "Lane compare into a mask"
syntax = ["VCEQ.t, VCGT.t vD, vA, vB | Rs | #imm  (t = b w l f)", "VCGTU.t vD, vA, vB | Rs | #imm  (t = b w l)"]
op = "vD[i] <- all ones if vA[i] == | > | >u operand, else 0"
notes = "The mask is an ordinary vector register: an integer lane of the size compared (also for `f`), all ones or zero, so `VAND`, `VBSL` and the stores take it without a mask file (errata 171). `VCGT` is signed, `VCGTU` unsigned; the floating-point compares are ordered: a NaN compares false (also `VCEQ` of a NaN with itself), -0.0 equals +0.0, no flag is set. The second operand may be a scalar register or an immediate (the same value in every lane). There is no less-than: swap the operands, or the arms of the select."

[vcgt]
wave = "wave 2"
meaning = "lane compare signed greater: a mask"
llvm = true
