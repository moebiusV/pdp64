syntax = ["VMULH.w, VMULHU.w, VMULHR.w vD, vA, vB | Rs | #imm"]
op = "vD[i] <- (vA[i] x vB[i]) >> 16 (signed, unsigned);  VMULHR: (vA[i] x vB[i] + 2^14) >> 15, saturated to 32767"
notes = "16-bit lanes. `VMULHR` is the Q15 rounding multiply (`pmulhrsw`, `sqrdmulh`); the one product that does not fit, -32768 x -32768, gives 32767, not -32768 (the saturation of `sqrdmulh`). A scalar register or an immediate is the same value in every lane (the constants of a transform)."

