asm = "dacc"
entry = "VDACC"
entry_seq = 20
title = "Dot product and sum of absolute differences into a register"
syntax = ["VDACC.b, VDACC.bu, VDACC.bsu, VDACC.w Rd, vA, vB", "VSAD.bu Rd, vA, vB"]
op = "Rd <- Rd + the exact sum of the products of all the lanes of the strip;  VSAD: Rd <- Rd + the sum of |vA[i] - vB[i]| over the unsigned byte lanes"
notes = "`VDACC` is a `VDOT` and a `VACC` in one word: the strip stays 32 bytes of byte lanes, and no 32-bit lane is held. Signed (`b`), unsigned (`bu`), signed by unsigned (`bsu`) bytes, signed halfwords (`w`). The sum is exact (not wrapped to 32 bits) and added to the 64-bit register, which is committed when the strip commits, as `VACC`: no state crosses a strip."

