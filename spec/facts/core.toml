# The facts about the base mnemonics of the core (non-vec) instructions (errata 184).
#
# The grammar (spec/grammars.d/) is the source of truth for the names, the encodings and the operand shapes; this file holds what a grammar cannot, one table for each base
# mnemonic (the part of a word before the first dot).  tools/facts.py reads it and `tools/facts.py --check` fails when the grammar has a core base with no table here or a
# table here names a base the grammar no longer has.  The vec family is spec/facts/vec.toml.
#
# Fields: exec      the executor's handler kind (H_xxx of common/pdp64exec_enc.inc) of the word of this base; H_UNIMPL: the executor traps it as not implemented
#         arg       the handler's argument (a MN_xxx constant, a condition number, a size)
#         exec_dotted   the suffixes of the dotted words of the base that the executor runs as the plain word (movq.u: the explicit user-mode move)
#         exec_cc   true: the words BASE.<cc> (trapcc.ne ... trapcc.los) are run by the handler, with the number of the condition as the argument (ne 1, eq 2, ... los 14: CC in tools/gen-core-names.py)
# The table common/pdp64exec_corehdefs.inc is generated from the fields exec, arg, exec_dotted, exec_cc by tools/gen-core-names.py.

