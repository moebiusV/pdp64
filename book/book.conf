# buildabook configuration for the manual of one member (tools/mkbook.sh replaces @MEMBER@ and @ID@) (obconf syntax); see ~/claude/buildabook/README.
title "The @MEMBER@ Architecture Manual"
subtitle "A 64-bit extension of the PDP-11"
tagline "Digital Equity Collective's Pragmatic Digital Processor, 64 bit"
author "David Walther"
year 2026
slug pdp64-@ID@

build {
    outline    outline.txt
    src        chapters
    out        rendered
    template   template.typ
    number-map number_map.csv
}
